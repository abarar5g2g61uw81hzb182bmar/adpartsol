name = "adpartsol"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"


[[d1_databases]]
binding = "DB"
database_name = "adpartsol-db"
database_id = "d0735e87-1b20-4dad-88fa-ae438bab0266"

[triggers]
crons = ["* * * * *"]

[vars]
ADMIN_TG_ID = "8826122972"
LOGS_GROUP_ID = "-1003725562445"
PACKING_GROUP_ID = "-1004221312474"
PAYMENT_GROUP_ID = "-1003899231714"
VAULT_GROUP_ID = "-1004388781992"
WA_PHONE_ID = "1374252479107736"
WA_WABA_ID = "1106679415484985"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
