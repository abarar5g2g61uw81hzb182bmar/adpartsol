<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AD PartSol — Partner Supplier Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FFFFFF;--bg:#F8F8F8;--cv:#FFFFFF;--ink:#080808;--mute:#777777;
  --line:#EAEAEA;--hover:#F3F3F3;--inv:#FFFFFF;--amber:#8A6414;--red:#B3261E;--green:#1E7347;
  --r:10px;--rc:14px;--ease:cubic-bezier(.2,.7,.2,1);
}
:root[data-theme="dark"]{
  --page:#080808;--bg:#121212;--cv:#0E0E0E;--ink:#F2F2F2;--mute:#8C8C8C;
  --line:#262626;--hover:#1A1A1A;--inv:#080808;--amber:#D9A441;--red:#F0716A;--green:#4FC083;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Inter",system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--page);padding:20px 14px 80px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:740px;margin:0 auto}

/* Orbital Loader */
#loader{position:fixed;inset:0;z-index:999;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);display:none;place-items:center}
:root[data-theme="dark"] #loader{background:rgba(8,8,8,.84)}
#loader.on{display:grid}
.orb{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.top{background:var(--cv);border:1px solid var(--line);border-radius:var(--rc);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.025em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.scard{background:var(--cv);border:1px solid var(--line);border-radius:var(--rc);padding:14px}
.scard .big{font-size:22px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.mute{font-size:12px;color:var(--mute)}

.search{display:flex;align-items:center;gap:8px;background:var(--cv);border:1px solid var(--line);border-radius:var(--r);padding:0 14px;margin-bottom:18px}
.search input{border:0;background:none;outline:0;padding:12px 0;width:100%;font-size:14px;color:var(--ink)}

.sec-hdr{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--cv);border:1px solid var(--line);border-radius:var(--rc);padding:16px 18px;margin-bottom:12px;transition:border-color .2s}
.card:hover{border-color:#BDBDBD}
.req-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.req-info b{font-size:15px;font-weight:600;display:block;margin-bottom:4px;letter-spacing:-.01em}
.btns{display:flex;gap:8px;flex:none}
.ibtn{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--cv);font-size:16px;font-weight:700;display:grid;place-items:center;transition:all .15s}
.ibtn.ok{color:var(--green);border-color:rgba(30,115,71,.35)}
.ibtn.ok:hover{background:var(--green);color:#fff}
.ibtn.no{color:var(--red);border-color:rgba(179,38,30,.35)}
.ibtn.no:hover{background:var(--red);color:#fff}
.chip{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:500;border:1px solid var(--line);background:var(--bg)}
.chip.g{color:var(--green);border-color:rgba(30,115,71,.3)}
.chip.r{color:var(--red);border-color:rgba(179,38,30,.3)}
.chip.a{color:var(--amber);border-color:rgba(138,100,20,.3)}

.inbox{background:var(--cv);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:16px;width:100%;outline:0;color:var(--ink)}
.inbox:focus{border-color:var(--ink)}
.btn{width:100%;padding:13px;border-radius:var(--r);background:var(--ink);color:var(--inv);font-weight:600;font-size:14px}

#modal{position:fixed;inset:0;background:rgba(8,8,8,.55);backdrop-filter:blur(6px);display:none;place-items:center;padding:16px;z-index:100}
#modal.on{display:grid}
.mbox{width:min(420px,100%);background:var(--cv);border:1px solid var(--line);border-radius:18px;padding:24px 20px}
</style>
</head>
<body>
<div id="loader"><div class="orb"></div></div>

<div class="wrap">
  <div class="top">
    <div>
      <h1 id="supName">AD PartSol — Supplier Desk</h1>
      <div class="mute" id="supSub">Verified Partner Feed</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button type="button" id="statusBtn" onclick="toggleSleep()" class="chip g" style="cursor:pointer;padding:6px 12px">● Online</button>
      <button type="button" onclick="toggleTheme()" class="ibtn" style="width:38px;height:38px;font-size:13px">◐</button>
      <button type="button" onclick="loadFeed()" class="ibtn" style="width:auto;padding:0 12px;font-size:12.5px">↻ Sync</button>
    </div>
  </div>

  <div id="loginCard" class="card" style="display:none;padding:24px">
    <h3 style="margin:0 0 8px">Partner Authentication</h3>
    <p class="mute" style="margin:0 0 16px">Enter the verification code provided by AD PartSol Admin:</p>
    <input id="codeInput" class="inbox" placeholder="e.g. SUP8X92A" style="margin-bottom:12px">
    <button type="button" class="btn" onclick="saveCode()">Access Supplier Portal</button>
  </div>

  <div id="mainFeed" style="display:none">
    <div class="stats">
      <div class="scard"><div class="mute">Pending</div><div class="big" id="stPend">0</div></div>
      <div class="scard"><div class="mute">Accepted (✓)</div><div class="big" id="stAcc" style="color:var(--green)">0</div></div>
      <div class="scard"><div class="mute">Declined (✕)</div><div class="big" id="stDec" style="color:var(--mute)">0</div></div>
    </div>

    <div class="search">
      <span>⌕</span>
      <input placeholder="Filter requests by brand, model, part name, or Order ID..." oninput="filterReqs(this.value)">
    </div>

    <div class="sec-hdr"><span>1. Pending Requests (Upcoming)</span><span class="chip a" id="cntPend">0</span></div>
    <div id="listPending"></div>

    <div class="sec-hdr"><span>2. Accepted Bids (In Bid Room)</span><span class="chip g" id="cntAcc">0</span></div>
    <div id="listAccepted"></div>

    <div class="sec-hdr"><span>3. Declined Requests</span><span class="chip r" id="cntDec">0</span></div>
    <div id="listDeclined"></div>
  </div>
</div>

<!-- Rate & Quantity Popup Modal -->
<div id="modal">
  <div class="mbox">
    <h3 id="mTitle" style="margin:0 0 4px;font-size:17px">Submit Wholesale Rate</h3>
    <div id="mSub" class="mute" style="margin-bottom:18px"></div>
    <div style="display:grid;grid-template-columns:1fr 120px;gap:10px;margin-bottom:18px">
      <div>
        <label class="mute" style="display:block;margin-bottom:6px;font-size:10.5px;text-transform:uppercase">Per Piece Price (₹)</label>
        <input id="mPrice" type="number" class="inbox" placeholder="₹ Rate/pc" inputmode="numeric">
      </div>
      <div>
        <label class="mute" style="display:block;margin-bottom:6px;font-size:10.5px;text-transform:uppercase">Available Qty</label>
        <select id="mQty" class="inbox"></select>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button type="button" class="btn" onclick="submitAccept()">Continue & Submit</button>
      <button type="button" class="ibtn" style="width:90px;font-size:12.5px" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
const API_BASE = location.hostname.includes("workers.dev") ? "" : "https://adpartsol.storzen-io.workers.dev";
const params = new URLSearchParams(location.search);
let CODE = params.get("code") || localStorage.getItem("adp_sup_code") || "";
let ITEMS = [];
let ACTIVE_BID = null;
let IS_ACTIVE = 1;

if (CODE) { localStorage.setItem("adp_sup_code", CODE); loadFeed(); }
else { document.getElementById("loginCard").style.display = "block"; }

function saveCode() {
  CODE = document.getElementById("codeInput").value.trim();
  if (!CODE) return;
  localStorage.setItem("adp_sup_code", CODE);
  loadFeed();
}

async function loadFeed() {
  document.getElementById("loader").classList.add("on");
  try {
    const res = await fetch(API_BASE + "/api/supplier/feed?code=" + encodeURIComponent(CODE));
    const data = await res.json();
    document.getElementById("loader").classList.remove("on");
    if (!data.ok) {
      document.getElementById("loginCard").style.display = "block";
      document.getElementById("mainFeed").style.display = "none";
      return;
    }
    document.getElementById("loginCard").style.display = "none";
    document.getElementById("mainFeed").style.display = "block";
    document.getElementById("supName").textContent = data.supplier.name;
    IS_ACTIVE = data.supplier.is_active;
    updateStatusBadge();
    ITEMS = data.requests || [];
    renderSections();
  } catch (_) {
    document.getElementById("loader").classList.remove("on");
  }
}

function updateStatusBadge() {
  const b = document.getElementById("statusBtn");
  b.className = "chip " + (IS_ACTIVE ? "g" : "a");
  b.textContent = IS_ACTIVE ? "● Online (Receiving)" : "☾ Sleep Mode";
}

async function toggleSleep() {
  const r = await fetch(API_BASE + "/api/supplier/toggle-active?code=" + encodeURIComponent(CODE), { method: "POST" });
  const d = await r.json();
  if (d.ok) { IS_ACTIVE = d.is_active; updateStatusBadge(); }
}

function renderSections() {
  const pend = ITEMS.filter(x => x.bid_status === "PENDING" && x.order_status === "BIDDING");
  const acc  = ITEMS.filter(x => x.bid_status === "SUBMITTED");
  const dec  = ITEMS.filter(x => x.bid_status === "DECLINED" || x.bid_status === "PASS");

  document.getElementById("cntPend").textContent = document.getElementById("stPend").textContent = pend.length;
  document.getElementById("cntAcc").textContent  = document.getElementById("stAcc").textContent  = acc.length;
  document.getElementById("cntDec").textContent  = document.getElementById("stDec").textContent  = dec.length;

  document.getElementById("listPending").innerHTML = pend.length ? pend.map(x => `
    <div class="card req-card">
      <div class="req-row">
        <div class="req-info">
          <b>${x.brand} ${x.model || ""} — ${x.part_name}</b>
          <div class="mute">Quality: <b>${x.variant || "Standard"}</b> • Required: <b>${x.req_qty} pcs</b> • Req #${x.order_id}</div>
        </div>
        <div class="btns">
          <button type="button" class="ibtn ok" onclick="openAcceptModal(${x.bid_id})">✓</button>
          <button type="button" class="ibtn no" onclick="declineItem(${x.bid_id})">✕</button>
        </div>
      </div>
    </div>
  `).join("") : `<div class="card mute">No pending requests right now.</div>`;

  document.getElementById("listAccepted").innerHTML = acc.length ? acc.map(x => `
    <div class="card req-card">
      <div class="req-row">
        <div class="req-info">
          <b>${x.brand} ${x.model || ""} — ${x.part_name}</b>
          <div class="mute">Quality: ${x.variant || "Standard"} • Req #${x.order_id}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:17px;font-weight:700;color:var(--green)">₹${x.price_per_unit}/pc</div>
          <span class="chip g">Qty: ${x.available_qty} pcs</span>
        </div>
      </div>
    </div>
  `).join("") : `<div class="card mute">No accepted bids yet.</div>`;

  document.getElementById("listDeclined").innerHTML = dec.length ? dec.map(x => `
    <div class="card req-card" style="opacity:.7">
      <div class="req-row">
        <div class="req-info">
          <b>${x.brand} ${x.model || ""} — ${x.part_name}</b>
          <div class="mute">Quality: ${x.variant || "Standard"} • Req: ${x.req_qty} pcs</div>
        </div>
        ${x.order_status === "BIDDING" ? `<button type="button" class="ibtn" style="width:auto;padding:0 12px;font-size:12px" onclick="restoreItem(${x.bid_id})">↺ Restore</button>` : `<span class="chip r">Declined</span>`}
      </div>
    </div>
  `).join("") : `<div class="card mute">No declined requests.</div>`;
}

function openAcceptModal(bidId) {
  const item = ITEMS.find(x => x.bid_id === bidId);
  if (!item) return;
  ACTIVE_BID = item;
  document.getElementById("mTitle").textContent = `${item.brand} ${item.model || ""} — ${item.part_name}`;
  document.getElementById("mSub").textContent = `Quality: ${item.variant || "Standard"} • Customer Required: ${item.req_qty} Pieces`;
  document.getElementById("mPrice").value = "";

  const sel = document.getElementById("mQty");
  let opts = "";
  for (let i = item.req_qty; i >= 1; i--) {
    opts += `<option value="${i}">${i} ${i === 1 ? "pc" : "pcs"}</option>`;
  }
  sel.innerHTML = opts;
  document.getElementById("modal").classList.add("on");
  setTimeout(() => document.getElementById("mPrice").focus(), 80);
}

function closeModal() { document.getElementById("modal").classList.remove("on"); ACTIVE_BID = null; }

async function submitAccept() {
  if (!ACTIVE_BID) return;
  const price = parseFloat(document.getElementById("mPrice").value);
  const qty = parseInt(document.getElementById("mQty").value, 10);
  if (!price || price <= 0) return alert("Enter valid per piece price");

  ACTIVE_BID.bid_status = "SUBMITTED";
  ACTIVE_BID.price_per_unit = price;
  ACTIVE_BID.available_qty = qty;
  const bidId = ACTIVE_BID.bid_id;
  closeModal();
  renderSections();

  await fetch(API_BASE + "/api/supplier/respond?code=" + encodeURIComponent(CODE), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ bid_id: bidId, decision: "ACCEPT", price, qty })
  });
}

async function declineItem(bidId) {
  const item = ITEMS.find(x => x.bid_id === bidId);
  if (!item) return;
  item.bid_status = "DECLINED";
  renderSections();
  await fetch(API_BASE + "/api/supplier/respond?code=" + encodeURIComponent(CODE), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ bid_id: bidId, decision: "DECLINE" })
  });
}

async function restoreItem(bidId) {
  const item = ITEMS.find(x => x.bid_id === bidId);
  if (!item) return;
  item.bid_status = "PENDING";
  renderSections();
  await fetch(API_BASE + "/api/supplier/respond?code=" + encodeURIComponent(CODE), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ bid_id: bidId, decision: "RESTORE" })
  });
}

function filterReqs(q) {
  q = q.toLowerCase();
  document.querySelectorAll(".req-card").forEach(el => {
    el.style.display = el.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}
function toggleTheme() {
  const r = document.documentElement;
  r.setAttribute("data-theme", r.getAttribute("data-theme") === "dark" ? "light" : "dark");
}
</script>
</body>
</html>
