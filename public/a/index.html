<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AD PartSol — Super Admin Cockpit</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e3e8f4;--hi:#ebeffa;--lo:#d8dfee;--sd:rgba(146,160,198,.78);--sl:rgba(255,255,255,.95);--ink:#2e3c5f;--mute:#70809f;--line:rgba(38,54,74,.08);--teal:#5b9dff;--teal2:#a8cdff;--deep:#4a8af0;--amber:#e99a2b;--red:#e0524a;--green:#25a862;--rz:9px 9px 20px var(--sd),-9px -9px 20px var(--sl);--rs:5px 5px 11px var(--sd),-5px -5px 11px var(--sl);--in:inset 5px 5px 11px var(--sd),inset -5px -5px 11px var(--sl);--cv:linear-gradient(145deg,var(--hi),var(--lo))}
:root[data-theme="dark"]{--bg:#151b2e;--hi:#1b2338;--lo:#11172a;--sd:rgba(4,7,18,.82);--sl:rgba(52,68,112,.32);--ink:#e6ecfa;--mute:#8a98bd;--line:rgba(255,255,255,.07);--deep:#8fb0ff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;max-width:100vw;overflow-x:hidden;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Login Screen */
#login{position:fixed;inset:0;display:grid;place-items:center;padding:18px;z-index:100;background:var(--bg);transition:opacity .5s}
#login.out{opacity:0;pointer-events:none}
.lbox{width:min(400px,100%);background:var(--cv);border-radius:32px;padding:34px 24px 28px;box-shadow:var(--rz)}
.logo{width:76px;height:76px;border-radius:50%;background:var(--cv);box-shadow:var(--rz);display:grid;place-items:center;color:var(--deep);font-weight:800;font-size:24px;margin:0 auto 16px;position:relative}
.logo:before{content:"";position:absolute;inset:8px;border-radius:50%;box-shadow:var(--in)}
.logo span{position:relative}
.lbox h1{margin:0;text-align:center;font-size:24px;font-weight:800}
.lbox p{text-align:center;color:var(--mute);margin:6px 0 22px;font-size:13px}
.fld{display:flex;align-items:center;gap:10px;background:var(--bg);box-shadow:var(--in);border-radius:16px;padding:0 16px;margin-bottom:14px;color:var(--mute)}
.fld input{flex:1;border:0;background:none;padding:15px 0;outline:0;font-size:16px;color:var(--ink);min-width:0}
.btn{width:100%;padding:15px;border-radius:16px;background:linear-gradient(145deg,#7db4ff,#4a8af0);color:#fff;font-weight:800;font-size:15px;box-shadow:6px 6px 14px var(--sd),-4px -4px 10px var(--sl)}
.err{color:var(--red);font-size:12.5px;text-align:center;min-height:18px;margin-top:10px;font-weight:600}

/* App Shell */
#app{display:none;min-height:100dvh;padding:20px;gap:22px;grid-template-columns:88px minmax(0,1fr)}
#app.show{display:grid}
aside{background:var(--cv);border-radius:28px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:20px;height:calc(100dvh - 40px);box-shadow:var(--rz);z-index:40}
aside .av{width:46px;height:46px;border-radius:50%;box-shadow:var(--in);display:grid;place-items:center;font-weight:800;color:var(--deep);margin-bottom:6px;flex:none}
nav{display:flex;flex-direction:column;gap:6px;width:100%;overflow-y:auto;scrollbar-width:none;flex:1;padding:2px}
nav::-webkit-scrollbar{display:none}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;font-size:10px;font-weight:700;color:var(--mute);transition:.25s;flex:none}
nav button.on{color:var(--teal);box-shadow:var(--in)}
.tools{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.tools button,.mbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--rs);color:var(--deep);background:var(--cv);flex:none}
.tools button:active,.mbtn:active{box-shadow:var(--in)}
.mbtn{display:none}

main{min-width:0;width:100%}
.top{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.top h2{margin:0;font-size:24px;font-weight:800;flex:1;min-width:160px}
.top h2 small{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-top:3px}
.search{display:flex;align-items:center;gap:10px;background:var(--bg);box-shadow:var(--in);border-radius:16px;padding:0 14px;min-width:220px;flex:1;color:var(--mute)}
.search input{border:0;background:none;outline:0;padding:12px 0;width:100%;font-size:15px;color:var(--ink)}

/* Responsive Grid & Cards */
.grid{display:grid;gap:18px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--cv);border-radius:24px;padding:20px;box-shadow:var(--rz);min-width:0;overflow:hidden}
.card h3{margin:0 0 14px;font-size:14.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--deep)}
.mute{color:var(--mute);font-size:12px;line-height:1.45}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;box-shadow:var(--in);color:var(--deep);background:var(--bg);white-space:nowrap}
.chip.r{color:var(--red)}.chip.a{color:var(--amber)}.chip.g{color:var(--green)}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.row .g1{flex:1;min-width:150px}
.row b{display:block;font-size:13.5px}

.inbox{background:var(--bg);box-shadow:var(--in);border:0;border-radius:14px;padding:11px 14px;color:var(--ink);font-size:15px;font-weight:600;outline:0;width:100%;min-width:0}
.act{padding:10px 16px;border-radius:14px;font-weight:700;font-size:12.5px;color:var(--deep);box-shadow:var(--rs);background:var(--cv);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.act:active{box-shadow:var(--in)}
.act.p{background:linear-gradient(145deg,#7db4ff,#4a8af0);color:#fff}
.act.d{color:var(--red)}

.tog{width:48px;height:26px;border-radius:99px;background:var(--bg);box-shadow:var(--in);position:relative;flex:none;cursor:pointer}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--cv);box-shadow:2px 2px 5px var(--sd);transition:transform .28s cubic-bezier(.3,1.3,.5,1),background .25s}
.tog.on:after{transform:translateX(22px);background:linear-gradient(145deg,var(--teal2),var(--deep))}

.tabs{display:flex;gap:10px;margin-bottom:18px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:9px 16px;border-radius:99px;box-shadow:var(--rs);font-weight:700;font-size:12px;color:var(--mute);background:var(--cv);flex:none;white-space:nowrap}
.tabs button.on{box-shadow:var(--in);color:var(--deep)}

.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding:14px 10px;border-radius:20px;box-shadow:var(--in);overflow-x:auto}
.bars div{flex:1;min-width:42px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;color:var(--mute);gap:6px;text-align:center}
.bars i{width:100%;max-width:28px;border-radius:8px;background:linear-gradient(180deg,var(--teal2),var(--deep));transition:height .8s ease}

.scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;color:var(--mute);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid var(--line)}

.shot{height:150px;border-radius:16px;box-shadow:var(--in);display:grid;place-items:center;margin:10px 0;overflow:hidden;background:#0b0f19}
.shot img{width:100%;height:100%;object-fit:contain}

#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--cv);color:var(--ink);padding:12px 20px;border-radius:16px;font-size:12.5px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:90;box-shadow:var(--rz);border:1px solid var(--teal);max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.stop{width:100%;padding:16px;border-radius:18px;background:linear-gradient(145deg,#ee6a62,#c9413a);color:#fff;font-weight:800;letter-spacing:.04em;box-shadow:var(--rs)}

/* 1000% Mobile Responsive Breakpoints */
@media (max-width:920px){
  #app{grid-template-columns:1fr;padding:12px 12px 104px;gap:14px}
  aside{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto;height:70px;flex-direction:row;padding:6px 8px;border-radius:24px;box-shadow:0 -4px 20px var(--sd),var(--rz)}
  aside .av,.tools{display:none}
  nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:6px;align-items:center}
  nav button{min-width:64px;padding:7px 4px;font-size:9.5px}
  .mbtn{display:grid}
  .top h2{font-size:20px;min-width:120px}
  .search{flex:1 1 100%;order:4}
  .grid{gap:14px}
  .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .c3{grid-column:span 6}
  .card{padding:16px;border-radius:20px}
  .big{font-size:22px}
}
@media (max-width:420px){
  .c3{grid-column:span 6}
  .row{gap:8px}
  .act{width:100%}
}
</style>
</head>
<body>

<section id="login">
  <form class="lbox" id="lf" autocomplete="off">
    <div class="logo"><span>AD</span></div>
    <h1>AD PartSol</h1>
    <p>Super Admin & Staff Command Deck</p>
    <label class="fld"><input id="u" placeholder="Admin Username / Phone" autocomplete="off"></label>
    <label class="fld"><input id="p" type="password" placeholder="Secret Password / ADP-Token" autocomplete="off"></label>
    <button class="btn" type="submit">Authenticate & Enter</button>
    <div class="err" id="err"></div>
  </form>
</section>

<div id="app">
  <aside>
    <div class="av">AD</div>
    <nav id="nav"></nav>
    <div class="tools">
      <button id="syncBtn" title="Sync"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7M21 3v6h-6"/></svg></button>
      <button id="theme" title="Theme"><svg class="i" viewBox="0 0 24 24"><path d="M20 14A8 8 0 019.5 4 8 8 0 1020 14z"/></svg></button>
      <button id="lock" title="Logout"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>
    </div>
  </aside>

  <main>
    <div class="top">
      <h2 id="ttl">Command Deck<small>Live D1 Engine</small></h2>
      <button class="mbtn" id="syncBtn2"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7M21 3v6h-6"/></svg></button>
      <button class="mbtn" id="theme2"><svg class="i" viewBox="0 0 24 24"><path d="M20 14A8 8 0 019.5 4 8 8 0 1020 14z"/></svg></button>
      <button class="mbtn" id="lock2"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>
      <label class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input placeholder="Search Order ID, Phone, Part, UTR, Supplier..." oninput="filterRows(this.value)">
      </label>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="toast"></div>

<script>
const KEY = "adps_master_session";
const $ = s => document.querySelector(s);
let STATE = {
  orders: [], payments: [], settings: {}, suppliers: [], items: [],
  bids: [], customers: [], staff_list: [], margin_rules: [],
  curPage: "home", ctrlCat: "pricing"
};

const ICONS = {
  home: "<rect x='3' y='3' width='7' height='7' rx='2'/><rect x='14' y='3' width='7' height='7' rx='2'/><rect x='3' y='14' width='7' height='7' rx='2'/><rect x='14' y='14' width='7' height='7' rx='2'/>",
  bidroom: "<circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 3'/>",
  margins: "<path d='M3 17l6-6 4 4 8-8'/><path d='M14 7h7v7'/>",
  sup: "<circle cx='9' cy='8' r='3.5'/><path d='M2 20c1-4 4-6 7-6s6 2 7 6'/><path d='M16 4.5a3.5 3.5 0 010 7M18 14c2 .6 3.4 2.6 4 6'/>",
  orders: "<path d='M21 8l-9-5-9 5v8l9 5 9-5z'/><path d='M3 8l9 5 9-5M12 13v8'/>",
  pay: "<rect x='3' y='6' width='18' height='13' rx='3'/><path d='M3 11h18'/>",
  pack: "<path d='M2 6h12v10H2zM14 10h4l4 3v3h-8'/><circle cx='7' cy='18' r='2'/><circle cx='17' cy='18' r='2'/>",
  controls: "<line x1='4' y1='21' x2='4' y2='14'/><line x1='4' y1='10' x2='4' y2='3'/><line x1='12' y1='21' x2='12' y2='12'/><line x1='12' y1='8' x2='12' y2='3'/><line x1='20' y1='21' x2='20' y2='16'/><line x1='20' y1='12' x2='20' y2='3'/><line x1='1' y1='14' x2='7' y2='14'/><line x1='9' y1='8' x2='15' y2='8'/><line x1='17' y1='16' x2='23' y2='16'/>",
  chat: "<path d='M4 5h16v11H9l-5 4z'/>",
  staff: "<path d='M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'/><path d='M9 12l2 2 4-4'/>"
};

const NAV = [
  ["home", "Cockpit", "home"],
  ["bidroom", "Bid Room", "bidroom"],
  ["margins", "Margins", "margins"],
  ["sup", "Suppliers", "sup"],
  ["orders", "Orders", "orders"],
  ["pay", "Payments", "pay"],
  ["pack", "Packing", "pack"],
  ["controls", "250+ Controls", "controls"],
  ["chat", "Customers", "chat"],
  ["staff", "Staff & Portals", "staff"]
];

$("#nav").innerHTML = NAV.map(n => `<button data-p="${n[0]}"><svg class="i" viewBox="0 0 24 24">${ICONS[n[2]]}</svg>${n[1]}</button>`).join("");
$("#nav").onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.p); };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove("on"), 2600);
}

function getCreds() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (_) { return null; } }

async function api(path, body) {
  const c = getCreds(); if (!c) return { ok: false, error: "Not logged in" };
  const opt = { method: body ? "POST" : "GET", headers: { "x-staff-phone": c.u, "x-staff-token": c.p } };
  if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch("/api/panel/" + path, opt);
  return await r.json();
}

async function syncAll(silent) {
  const d = await api("dashboard");
  if (!d.ok) { if (!silent) toast(d.error || "Auth failed"); return false; }
  STATE.orders = d.orders || [];
  STATE.payments = d.payments || [];
  STATE.suppliers = d.suppliers || [];
  STATE.items = d.items || [];
  STATE.bids = d.bids || [];
  STATE.customers = d.customers || [];
  STATE.staff_list = d.staff_list || [];
  STATE.margin_rules = d.margin_rules || [];
  STATE.settings = {};
  (d.settings || []).forEach(s => STATE.settings[s.key] = s.value);
  go(STATE.curPage, true);
  if (!silent) toast("★ Live Engine Synced");
  return true;
}

$("#lf").onsubmit = async e => {
  e.preventDefault();
  const u = $("#u").value.trim(), p = $("#p").value.trim();
  localStorage.setItem(KEY, JSON.stringify({ u, p }));
  const ok = await syncAll(true);
  if (ok) {
    $("#login").classList.add("out");
    setTimeout(() => $("#login").style.display = "none", 500);
    $("#app").classList.add("show");
    toast("★ Authenticated: Super Admin");
  } else {
    localStorage.removeItem(KEY);
    $("#err").textContent = "Invalid Admin Credentials (Check Cloudflare Secrets)";
  }
};

$("#syncBtn").onclick = $("#syncBtn2").onclick = () => syncAll(false);
$("#theme").onclick = $("#theme2").onclick = () => {
  const r = document.documentElement;
  r.setAttribute("data-theme", r.getAttribute("data-theme") === "dark" ? "light" : "dark");
};
$("#lock").onclick = $("#lock2").onclick = () => {
  localStorage.removeItem(KEY);
  location.reload();
};

/* Global Click Delegate for Toggles */
document.addEventListener("click", async e => {
  const tg = e.target.closest(".tog[data-k]");
  if (tg) {
    tg.classList.toggle("on");
    const k = tg.dataset.k, v = tg.classList.contains("on") ? "1" : "0";
    STATE.settings[k] = v;
    await api("save-settings", { [k]: v });
    toast(`★ ${k} = ${v === "1" ? "ON" : "OFF"}`);
  }
});

function chip(t, c = "") { return `<span class="chip ${c}">${t}</span>`; }
function tog(k, def = "1") {
  const isOn = (STATE.settings[k] ?? def) === "1";
  return `<span class="tog ${isOn ? "on" : ""}" data-k="${k}"></span>`;
}

const PAGES = {};

/* 1. HOME COCKPIT */
PAGES.home = () => {
  const pendPay = STATE.payments.filter(p => p.status === "PENDING").length;
  const bidOrds = STATE.orders.filter(o => o.status === "BIDDING").length;
  const rev = STATE.orders.reduce((a, o) => a + (Number(o.final_total) || 0), 0);
  const actSups = STATE.suppliers.filter(s => s.is_verified && s.is_active).length;

  return `<div class="grid">
    <div class="card c3"><div class="mute">Total Orders</div><div class="big">${STATE.orders.length}</div><div class="mute">${bidOrds} in live bidding</div></div>
    <div class="card c3"><div class="mute">Gross Volume</div><div class="big">₹${rev.toLocaleString("en-IN")}</div><div class="mute">Itemized invoices</div></div>
    <div class="card c3"><div class="mute">Pending Payments</div><div class="big">${pendPay}</div><div class="mute">Awaiting approval</div></div>
    <div class="card c3"><div class="mute">Active Suppliers</div><div class="big">${actSups}/${STATE.suppliers.length}</div><div class="mute">Online partners</div></div>

    <div class="card c7">
      <h3>Direct Call-to-Supplier Assign (Instant Notice) ${chip("Phone Override", "a")}</h3>
      <div class="mute" style="margin-bottom:12px">Select any Order ID & Supplier after phone confirmation. Sends itemized invoice to customer & notice to supplier:</div>
      <div class="grid" style="gap:10px">
        <div class="c4"><input id="asgOrd" class="inbox" placeholder="Order ID" value="${STATE.orders[0]?.id || ""}"></div>
        <div class="c4"><select id="asgSup" class="inbox">${STATE.suppliers.map(s => `<option value="${s.id}">#${s.id}${s.name}</option>`).join("")}</select></div>
        <div class="c4"><input id="asgPrice" class="inbox" type="number" placeholder="Base Rate (₹/pc)"></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="act p" onclick="assignSup()">[+] Assign & Dispatch Invoice</button>
        <button class="act" onclick="forceCloseAll()">⚡ Force Close All Active Bids</button>
      </div>
    </div>

    <div class="card c5">
      <h3>Primary Kill-Switches</h3>
      <div class="row"><div class="g1"><b>Telegram Bot Engine</b><span class="mute">@AdPartsol_Bot</span></div>${tog("tg_enabled", "1")}</div>
      <div class="row"><div class="g1"><b>WhatsApp Cloud Engine</b><span class="mute">+91 79928 09027</span></div>${tog("wa_enabled", "1")}</div>
      <div class="row"><div class="g1"><b>OpenAI 4-Model Brain</b><span class="mute">Luna & Transcribe</span></div>${tog("ai_enabled", "1")}</div>
      <div class="row"><div class="g1"><b>Manual Quote Approval</b><span class="mute">Hold auto-quotes for review</span></div>${tog("require_admin_approve", "0")}</div>
    </div>

    <div class="card c12">
      <h3>Recent Live Orders (${STATE.orders.length})</h3>
      ${STATE.orders.slice(0, 8).map(o => {
        const oItems = STATE.items.filter(i => i.order_id === o.id).map(i => `${i.brand} ${i.model}${i.part_name} (${i.fulfilled_qty}/${i.req_qty})`).join(", ");
        return `<div class="row">
          <div class="g1"><b>Order #${o.id} —${oItems || "Items"}</b><span class="mute">Customer: ${o.customer_id} | Base: ₹${o.supplier_base_total \vert{}\vert{} 0} \vert{} Final: ₹${o.final_total || 0}</span></div>
          <div style="display:flex;gap:8px;align-items:center">

/* 4. MEGA SUPPLIERS PAGE (GROWTH GRAPH + CHEAPEST WIN ANALYTICS + LOGS) */
PAGES.sup = () => {
  const supStats = STATE.suppliers.map(s => {
    const sBids = STATE.bids.filter(b => b.supplier_id === s.id);
    const sub = sBids.filter(b => b.status === "SUBMITTED");
    const dec = sBids.filter(b => b.status === "DECLINED");
    let wonCount = 0;
    STATE.items.forEach(it => {
      const al = JSON.parse(it.allocated_json || "[]");
      if (al.some(a => a.supplier_id === s.id)) wonCount++;
    });
    const avgPrice = sub.length ? Math.round(sub.reduce((a, b) => a + Number(b.price_per_unit || 0), 0) / sub.length) : 0;
    return { ...s, total_req: sBids.length, accepted: sub.length, declined: dec.length, won: wonCount, avgPrice };
  });

  const maxWon = Math.max(1, ...supStats.map(s => s.accepted));

  return `<div class="grid">
    <div class="card c7">
      <h3>📈 Supplier Growth & Bid Acceptance Graph</h3>
      <div class="bars">
        ${supStats.map(s => {
          const h = Math.max(12, Math.round((s.accepted / maxWon) * 100));
          return `<div><span style="font-weight:800;color:var(--deep)">${s.accepted}</span><i style="height:${h}\%"></i><b>${s.name.slice(0, 10)}</b></div>`;
        }).join("") || `<div class="mute">Add suppliers to view graph</div>`}
      </div>
    </div>

    <div class="card c5">
      <h3>[+] Register New Supplier Partner</h3>

      <input id="newSupPhone" class="inbox" placeholder="Supplier Phone Number" style="margin-bottom:12px">
      <button class="act p" style="width:100%" onclick="createSup()">[+] Generate Supplier Code & Portal Link</button>
    </div>

    <div class="card c12">
      <h3>Supplier Eligibility, Cheapest Selection Scorecard & Portal Links</h3>
      <div class="scroll">
        <table>
          <tr><th>ID & Name</th><th>Status</th><th>Requests</th><th>Accepted (✅)</th><th>Declined (❌)</th><th>Won (Cheapest)</th><th>Avg Bid</th><th>Verify Code & Portal</th></tr>

            <td><b>#${s.id}${s.name}</b><br><span class="mute">${s.phone || ""}</span></td>
            <td>${chip(s.is_verified ? (s.is_active ? "Online" : "Sleep") : "Unverified", s.is_verified ? "g" : "a")}</td>
            <td>${s.total_req}</td>
            <td><b style="color:var(--green)">${s.accepted}</b></td>
            <td><b style="color:var(--red)">${s.declined}</b></td>
            <td>${chip(s.won + " Orders Won", "g")}</td>
            <td>${s.avgPrice ? "₹" + s.avgPrice : "—"}</td>
            <td><code>/verify ${s.verify_code}</code> <a href="/s?code=${s.verify_code}" target="_blank" class="act" style="padding:6px 10px;margin-left:6px">Open Panel ↗</a></td>

    </div>
  </div>`;
};

    ${Object.keys(CTRL_SCHEMA).map(k => `<button class="${STATE.ctrlCat === k ? "on" : ""}" onclick="STATE.ctrlCat='${k}';go('controls',true)">${k.toUpperCase()}</button>`).join("")}
  </div>
  <div class="grid">
    <div class="card c6">
      <h3>${cat.title} — Parameters</h3>
      ${cat.inputs.map(inp => `<div class="row">
        <div class="g1"><b>${inp[1]}</b><span class="mute">Key: ${inp[0]}</span></div>
        <input class="inbox ctrl-inp" data-k="${inp[0]}" style="width:170px" value="${STATE.settings[inp[0]] ?? inp[2]}">
      </div>`).join("")}
      <button class="act p" style="width:100%;margin-top:14px" onclick="saveCtrlInputs()">[+] Save All Parameters in Category</button>
    </div>
    <div class="card c6">
      <h3>Live Feature Switches (Instant Sync)</h3>
      ${cat.toggles.map(t => `<div class="row">
        <div class="g1"><b>${t[1]}</b><span class="mute">Switch: ${t[0]}</span></div>
        ${tog(t[0], t[2])}
      </div>`).join("")}
    </div>
  </div>`;
};

/* 9. CUSTOMERS & DIRECT CHAT */
PAGES.chat = () => {
  return `<div class="grid">
    <div class="card c7">
      <h3>Registered B2B Customers (${STATE.customers.length})</h3>
      <div class="scroll"><table>
        <tr><th>Customer ID</th><th>Name & Shop</th><th>Phone</th><th>Address</th><th>Lang</th><th>Chat</th></tr>
        ${STATE.customers.map(c => `<tr>
          <td><b>${c.id}</b></td>
          <td>${c.full_name || "—"}</td>
          <td>${c.phone || "—"}</td>
          <td>${c.address || "—"}</td>
          <td>${chip(c.lang)}</td>
          <td><button class="act" onclick="$('#dmCid').value='${c.id}'">Message</button></td>
        </tr>`).join("")}
      </table></div>
    </div>
    <div class="card c5">
      <h3>Send Direct Message to Customer</h3>
      <input id="dmCid" class="inbox" placeholder="Customer ID (tg_... or wa_...)" value="${STATE.customers[0]?.id || ""}" style="margin-bottom:10px">
      <input id="dmTxt" class="inbox" placeholder="Type message..." style="margin-bottom:12px">
      <button class="act p" style="width:100%" onclick="sendDM()">Send Direct Message</button>
    </div>
  </div>`;
};

/* 10. STAFF & DEDICATED ROLE PORTALS */
PAGES.staff = () => {
  return `<div class="grid">
    <div class="card c6">
      <h3>Dedicated Role Portals (1-Tap Launch)</h3>
      <div class="row"><div class="g1"><b>Super Admin Cockpit</b><span class="mute">/a</span></div><a href="/a" class="act">Open ↗</a></div>
      <div class="row"><div class="g1"><b>Supplier Partner Portal</b><span class="mute">/s (Pending / Accepted / Declined)</span></div><a href="/s" target="_blank" class="act">Open ↗</a></div>
      <div class="row"><div class="g1"><b>Payment Manager Portal</b><span class="mute">/pay (20% & 80% Verification)</span></div><a href="/pay" target="_blank" class="act">Open ↗</a></div>
      <div class="row"><div class="g1"><b>Packing & Delivery Portal</b><span class="mute">/p (Pickup, Video & Tracking)</span></div><a href="/p" target="_blank" class="act">Open ↗</a></div>
      <div class="row"><div class="g1"><b>Customer Setup & Order Portal</b><span class="mute">/c (Forms & 9-Digit Tracker)</span></div><a href="/c" target="_blank" class="act">Open ↗</a></div>
    </div>
    <div class="card c6">
      <h3>Generate Staff Login Token</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <select id="stRole" class="inbox">
          <option value="order_desk">Order Desk</option>
          <option value="payment">Payment Manager</option>
          <option value="packing">Packing Team</option>
          <option value="inventory">Inventory Manager</option>
          <option value="support">Support Agent</option>
          <option value="finance">Accountant</option>
        </select>
        <input id="stPhone" class="inbox" placeholder="Staff Phone">
      </div>
      <button class="act p" style="width:100%;margin-bottom:16px" onclick="createStaff()">[+] Create Staff Token</button>
      ${STATE.staff_list.map(s => `<div class="row"><div class="g1"><b>${s.phone} (${s.role.toUpperCase()})</b><span class="mute">Token: ${s.access_token}</span></div>${chip("Active", "g")}</div>`).join("")}
      <button class="stop" style="margin-top:16px" onclick="emergencyStop()">EMERGENCY STOP ALL BOTS</button>
    </div>
  </div>`;
};

function go(p, skipScroll) {
  STATE.curPage = p;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.p === p));
  $("#view").innerHTML = PAGES[p] ? PAGES[p]() : PAGES.home();
  if (!skipScroll) scrollTo(0, 0);
}

/* Actions */
async function assignSup() {
  const order_id = $("#asgOrd").value.trim(), supplier_id = $("#asgSup").value, unit_price = $("#asgPrice").value.trim();
  if (!order_id || !supplier_id) return toast("Select Order & Supplier");
  const r = await api("assign-supplier", { order_id, supplier_id, unit_price });
  toast(r.msg || r.error); await syncAll(true);
}
async function quickPickSup(order_id, supplier_id, unit_price) {
  const r = await api("assign-supplier", { order_id, supplier_id, unit_price });
  toast(r.msg || "Winner Selected!"); await syncAll(true);
}
async function forceCloseAll() {
  const r = await api("force-close", {}); toast(r.msg); await syncAll(true);
}
async function forceCloseOrd(order_id) {
  const r = await api("force-close", { order_id }); toast(r.msg); await syncAll(true);
}
async function extendOrd(order_id, mins) {
  const r = await api("extend-window", { order_id, mins }); toast(r.msg); await syncAll(true);
}
async function addMarginSlab() {
  const min_price = $("#mMin").value, max_price = $("#mMax").value, margin_type = $("#mType").value, margin_value = $("#mVal").value;
  const r = await api("add-margin-rule", { min_price, max_price, margin_type, margin_value });
  if (!r.ok) return toast("× " + r.error);
  toast("★ " + r.msg); await syncAll(true);
}
async function delMarginSlab(id) {
  await api("delete-margin-rule", { id }); toast("Slab deleted"); await syncAll(true);
}
async function saveFallbackMargin() {
  await api("save-settings", {
    delivery_charge: $("#fDeliv").value,
    margin_percent: $("#fMarg").value,
    rounding_step: $("#fRound").value
  });
  toast("★ Delivery & Fallback Saved"); await syncAll(true);
}
async function saveCtrlInputs() {
  const body = {};
  document.querySelectorAll(".ctrl-inp").forEach(el => body[el.dataset.k] = el.value.trim());
  await api("save-settings", body);
  toast("★ Category Parameters Saved!"); await syncAll(true);
}
async function createSup() {
  const name = $("#newSupName").value.trim(), phone = $("#newSupPhone").value.trim();
  if (!name) return toast("Enter supplier name");
  const r = await api("add-supplier", { name, phone });
  toast(r.msg); await syncAll(true);
}
async function payAct(payment_id, decision) {
  await api("payment-action", { payment_id, decision });
  toast("★ Payment " + decision); await syncAll(true);
}
async function shipOrd(order_id) {
  const tracking_id = $("#trk_" + order_id).value.trim();
  if (!tracking_id) return toast("Enter Tracking ID");
  const r = await api("ship-order", { order_id, tracking_id });
  toast(r.msg); await syncAll(true);
}
async function sendDM() {
  const customer_id = $("#dmCid").value.trim(), text = $("#dmTxt").value.trim();
  if (!customer_id || !text) return toast("Enter Customer ID & Message");
  const r = await api("send-chat", { customer_id, text });
  $("#dmTxt").value = ""; toast(r.msg);
}
async function createStaff() {
  const role = $("#stRole").value, phone = $("#stPhone").value.trim();
  if (!phone) return toast("Enter phone");
  const r = await api("add-staff", { role, phone });
  toast(r.msg); await syncAll(true);
}
async function emergencyStop() {
  if (!confirm("Pause all Bots immediately?")) return;
  await api("save-settings", { tg_enabled: "0", wa_enabled: "0", ai_enabled: "0" });
  toast("★ EMERGENCY STOP ACTIVATED"); await syncAll(true);
}
function filterRows(q) {
  q = q.toLowerCase();
  document.querySelectorAll(".row, tr").forEach(el => {
    if (el.tagName === "TR" && el.querySelector("th")) return;
    el.style.display = el.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}

if (getCreds()) {
  $("#login").style.display = "none";
  $("#app").classList.add("show");
  syncAll(true);
}
</script>
</body>
</html>
