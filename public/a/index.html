<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AD PartSol — Super Admin Cockpit</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e3e8f4;--hi:#ebeffa;--lo:#d8dfee;--sd:rgba(146,160,198,.78);--sl:rgba(255,255,255,.95);--ink:#2e3c5f;--mute:#70809f;--line:rgba(38,54,74,.08);--teal:#5b9dff;--teal2:#a8cdff;--deep:#4a8af0;--amber:#e99a2b;--red:#e0524a;--green:#25a862;--rz:9px 9px 20px var(--sd),-9px -9px 20px var(--sl);--rs:5px 5px 11px var(--sd),-5px -5px 11px var(--sl);--in:inset 5px 5px 11px var(--sd),inset -5px -5px 11px var(--sl);--cv:linear-gradient(145deg,var(--hi),var(--lo))}
:root[data-theme="dark"]{--bg:#151b2e;--hi:#1b2338;--lo:#11172a;--sd:rgba(4,7,18,.82);--sl:rgba(52,68,112,.32);--ink:#e6ecfa;--mute:#8a98bd;--line:rgba(255,255,255,.07);--deep:#8fb0ff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;max-width:100vw;overflow-x:hidden;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* PREMIUM ORBITAL NEUMORPHIC LOADER */
#loader{position:fixed;inset:0;z-index:9999;background:rgba(227,232,244,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;place-items:center;padding:24px;transition:opacity .35s ease}
:root[data-theme="dark"] #loader{background:rgba(21,27,46,.84)}
#loader.on{display:grid}
.ldr-card{background:var(--cv);border-radius:32px;padding:32px 28px;box-shadow:var(--rz);display:flex;flex-direction:column;align-items:center;text-align:center;max-width:320px;width:100%;animation:popIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.orb-wrap{width:88px;height:88px;position:relative;display:grid;place-items:center;margin-bottom:18px}
.orb-ring1{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--deep);border-right-color:var(--teal2);animation:spinOrb 1s cubic-bezier(.5,.1,.5,.9) infinite}
.orb-ring2{position:absolute;inset:10px;border-radius:50%;border:2.5px solid transparent;border-bottom-color:var(--teal);border-left-color:var(--amber);animation:spinOrb 1.4s linear infinite reverse}
.orb-core{width:52px;height:52px;border-radius:50%;background:var(--cv);box-shadow:var(--in);display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--deep);letter-spacing:.03em;animation:pulseCore 1.6s ease-in-out infinite}
@keyframes spinOrb{to{transform:rotate(360deg)}}
@keyframes pulseCore{50%{transform:scale(.92);color:var(--teal)}}
.ldr-title{font-weight:800;font-size:15px;margin-bottom:4px}
.ldr-sub{font-size:12px;color:var(--mute);line-height:1.4}

/* Login Screen */
#login{position:fixed;inset:0;display:grid;place-items:center;padding:18px;z-index:100;background:var(--bg);transition:opacity .45s}
#login.out{opacity:0;pointer-events:none}
.lbox{width:min(400px,100%);background:var(--cv);border-radius:32px;padding:34px 24px 28px;box-shadow:var(--rz)}
.logo{width:76px;height:76px;border-radius:50%;background:var(--cv);box-shadow:var(--rz);display:grid;place-items:center;color:var(--deep);font-weight:800;font-size:24px;margin:0 auto 16px;position:relative}
.logo:before{content:"";position:absolute;inset:8px;border-radius:50%;box-shadow:var(--in)}
.logo span{position:relative}
.lbox h1{margin:0;text-align:center;font-size:24px;font-weight:800}
.lbox p{text-align:center;color:var(--mute);margin:6px 0 22px;font-size:13px}
.fld{display:flex;align-items:center;gap:10px;background:var(--bg);box-shadow:var(--in);border-radius:16px;padding:0 16px;margin-bottom:14px;color:var(--mute)}
.fld input{flex:1;border:0;background:none;padding:15px 0;outline:0;font-size:16px;color:var(--ink);min-width:0}
.btn{width:100%;padding:15px;border-radius:16px;background:linear-gradient(145deg,#7db4ff,#4a8af0);color:#fff;font-weight:800;font-size:15px;box-shadow:6px 6px 14px var(--sd),-4px -4px 10px var(--sl);transition:transform .15s}
.btn:active{transform:scale(.97)}
.err{color:var(--red);font-size:12.5px;text-align:center;min-height:20px;margin-top:12px;font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* App Shell */
#app{display:none;min-height:100dvh;padding:20px;gap:22px;grid-template-columns:92px minmax(0,1fr)}
#app.show{display:grid}
aside{background:var(--cv);border-radius:28px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:20px;height:calc(100dvh - 40px);box-shadow:var(--rz);z-index:40}
aside .av{width:46px;height:46px;border-radius:50%;box-shadow:var(--in);display:grid;place-items:center;font-weight:800;color:var(--deep);margin-bottom:4px;flex:none}
nav{display:flex;flex-direction:column;gap:6px;width:100%;overflow-y:auto;scrollbar-width:none;flex:1;padding:2px}
nav::-webkit-scrollbar{display:none}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:16px;font-size:9.5px;font-weight:700;color:var(--mute);transition:.25s;flex:none;text-align:center}
nav button.on{color:var(--teal);box-shadow:var(--in)}
.tools{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.tools button,.mbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--rs);color:var(--deep);background:var(--cv);flex:none}
.tools button:active,.mbtn:active{box-shadow:var(--in)}
.mbtn{display:none}

main{min-width:0;width:100%}
.top{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.top h2{margin:0;font-size:24px;font-weight:800;flex:1;min-width:160px}
.top h2 small{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-top:3px}
.search{display:flex;align-items:center;gap:10px;background:var(--bg);box-shadow:var(--in);border-radius:16px;padding:0 14px;min-width:220px;flex:1;color:var(--mute)}
.search input{border:0;background:none;outline:0;padding:12px 0;width:100%;font-size:15px;color:var(--ink)}

/* Responsive Grid & Cards */
.grid{display:grid;gap:18px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--cv);border-radius:24px;padding:20px;box-shadow:var(--rz);min-width:0;overflow:hidden}
.card h3{margin:0 0 14px;font-size:14.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--deep)}
.mute{color:var(--mute);font-size:12px;line-height:1.45}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;box-shadow:var(--in);color:var(--deep);background:var(--bg);white-space:nowrap}
.chip.r{color:var(--red)}.chip.a{color:var(--amber)}.chip.g{color:var(--green)}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.row .g1{flex:1;min-width:150px}
.row b{display:block;font-size:13.5px}

.inbox{background:var(--bg);box-shadow:var(--in);border:0;border-radius:14px;padding:11px 14px;color:var(--ink);font-size:15px;font-weight:600;outline:0;width:100%;min-width:0}
.act{padding:10px 16px;border-radius:14px;font-weight:700;font-size:12.5px;color:var(--deep);box-shadow:var(--rs);background:var(--cv);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;text-decoration:none}
.act:active{box-shadow:var(--in)}
.act.p{background:linear-gradient(145deg,#7db4ff,#4a8af0);color:#fff}
.act.d{color:var(--red)}

.tog{width:48px;height:26px;border-radius:99px;background:var(--bg);box-shadow:var(--in);position:relative;flex:none;cursor:pointer}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--cv);box-shadow:2px 2px 5px var(--sd);transition:transform .28s cubic-bezier(.3,1.3,.5,1),background .25s}
.tog.on:after{transform:translateX(22px);background:linear-gradient(145deg,var(--teal2),var(--deep))}

.tabs{display:flex;gap:10px;margin-bottom:18px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:9px 16px;border-radius:99px;box-shadow:var(--rs);font-weight:700;font-size:12px;color:var(--mute);background:var(--cv);flex:none;white-space:nowrap}
.tabs button.on{box-shadow:var(--in);color:var(--deep)}

.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding:14px 10px;border-radius:20px;box-shadow:var(--in);overflow-x:auto}
.bars div{flex:1;min-width:42px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;color:var(--mute);gap:6px;text-align:center}
.bars i{width:100%;max-width:28px;border-radius:8px;background:linear-gradient(180deg,var(--teal2),var(--deep));transition:height .8s ease}

.scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;color:var(--mute);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid var(--line)}

.shot{height:150px;border-radius:16px;box-shadow:var(--in);display:grid;place-items:center;margin:10px 0;overflow:hidden;background:#0b0f19}
.shot img{width:100%;height:100%;object-fit:contain}

#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--cv);color:var(--ink);padding:12px 20px;border-radius:16px;font-size:12.5px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:90;box-shadow:var(--rz);border:1px solid var(--teal);max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.stop{width:100%;padding:16px;border-radius:18px;background:linear-gradient(145deg,#ee6a62,#c9413a);color:#fff;font-weight:800;letter-spacing:.04em;box-shadow:var(--rs)}

/* 1000% Mobile Responsive Breakpoints */
@media (max-width:920px){
  #app{grid-template-columns:1fr;padding:12px 12px 104px;gap:14px}
  aside{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto;height:72px;flex-direction:row;padding:6px 8px;border-radius:24px;box-shadow:0 -4px 20px var(--sd),var(--rz)}
  aside .av,.tools{display:none}
  nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:6px;align-items:center}
  nav button{min-width:66px;padding:7px 4px;font-size:9px}
  .mbtn{display:grid}
  .top h2{font-size:20px;min-width:120px}
  .search{flex:1 1 100%;order:4}
  .grid{gap:14px}
  .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .c3{grid-column:span 6}
  .card{padding:16px;border-radius:20px}
  .big{font-size:21px}
}
@media (max-width:420px){
  .c3{grid-column:span 6}
  .row{gap:8px}
  .act{width:100%}
}
</style>
</head>
<body>

<!-- PREMIUM ANIMATED LOADER -->
<div id="loader">
  <div class="ldr-card">
    <div class="orb-wrap">
      <div class="orb-ring1"></div>
      <div class="orb-ring2"></div>
      <div class="orb-core">AD</div>
    </div>
    <div class="ldr-title" id="ldrTitle">Connecting to Engine...</div>
    <div class="ldr-sub" id="ldrSub">Verifying credentials & device security</div>
  </div>
</div>

<!-- ZERO-RELOAD LOGIN SCREEN -->
<section id="login">
  <div class="lbox" id="lbox">
    <div class="logo"><span>AD</span></div>
    <h1>AD PartSol</h1>
    <p>Super Admin & Staff Command Deck</p>
    <label class="fld"><input id="u" type="text" placeholder="Admin Username / Phone" autocomplete="off"></label>
    <label class="fld"><input id="p" type="password" placeholder="Secret Password / ADP-Token" autocomplete="off"></label>
    <button class="btn" type="button" id="loginBtn" onclick="doLogin()">Authenticate & Enter</button>
    <div class="err" id="err"></div>
  </div>
</section>

<div id="app">
  <aside>
    <div class="av">AD</div>
    <nav id="nav"></nav>
    <div class="tools">
      <button id="syncBtn" title="Sync"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7M21 3v6h-6"/></svg></button>
      <button id="theme" title="Theme"><svg class="i" viewBox="0 0 24 24"><path d="M20 14A8 8 0 019.5 4 8 8 0 1020 14z"/></svg></button>
      <button id="lock" title="Logout"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>
    </div>
  </aside>

  <main>
    <div class="top">
      <h2 id="ttl">Command Deck<small>Live D1 Engine</small></h2>
      <button class="mbtn" id="syncBtn2"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7M21 3v6h-6"/></svg></button>
      <button class="mbtn" id="theme2"><svg class="i" viewBox="0 0 24 24"><path d="M20 14A8 8 0 019.5 4 8 8 0 1020 14z"/></svg></button>
      <button class="mbtn" id="lock2"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>
      <label class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input placeholder="Search Order ID, Phone, Part, UTR, Supplier..." oninput="filterRows(this.value)">
      </label>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="toast"></div>

<script>
window.onerror = function(message, source, lineno) {
  fetch("/api/panel/client-error", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ page: location.pathname, message: String(message), line: lineno })
  }).catch(function(){});
};

var KEY = "adps_master_session";
var $ = function(s) { return document.querySelector(s); };
var STATE = {
  orders: [], payments: [], settings: {}, suppliers: [], items: [],
  bids: [], customers: [], staff_list: [], margin_rules: [],
  inventory: [], inventory_logs: [], ghost_queries: [],
  curPage: "home", ctrlCat: "pricing"
};

function showLoader(title, sub) {
  $("#ldrTitle").textContent = title || "Processing...";
  $("#ldrSub").textContent = sub || "Syncing with Cloudflare D1 Engine";
  $("#loader").classList.add("on");
}
function hideLoader() { $("#loader").classList.remove("on"); }

var ICONS = {
  home: "<rect x='3' y='3' width='7' height='7' rx='2'/><rect x='14' y='3' width='7' height='7' rx='2'/><rect x='3' y='14' width='7' height='7' rx='2'/><rect x='14' y='14' width='7' height='7' rx='2'/>",
  bidroom: "<circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 3'/>",
  ops: "<path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/>",
  qcpack: "<path d='M9 11l3 3L22 4'/><path d='M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11'/>",
  stock: "<path d='M4 9l1-5h14l1 5'/><path d='M5 12v8h14v-8'/>",
  intel: "<path d='M3 17l6-6 4 4 8-8'/><path d='M14 7h7v7'/>",
  crm: "<path d='M4 5h16v11H9l-5 4z'/>",
  sup: "<circle cx='9' cy='8' r='3.5'/><path d='M2 20c1-4 4-6 7-6s6 2 7 6'/><path d='M16 4.5a3.5 3.5 0 010 7M18 14c2 .6 3.4 2.6 4 6'/>",
  margins: "<circle cx='12' cy='12' r='9'/><path d='M9 9c1-1.5 5-1.5 6 0M9 15c1 1.5 5 1.5 6 0M12 6v12'/>",
  pay: "<rect x='3' y='6' width='18' height='13' rx='3'/><path d='M3 11h18'/>",
  controls: "<line x1='4' y1='21' x2='4' y2='14'/><line x1='4' y1='10' x2='4' y2='3'/><line x1='12' y1='21' x2='12' y2='12'/><line x1='12' y1='8' x2='12' y2='3'/><line x1='20' y1='21' x2='20' y2='16'/><line x1='20' y1='12' x2='20' y2='3'/>",
  staff: "<path d='M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'/><path d='M9 12l2 2 4-4'/>"
};

var NAV = [
  ["home", "Cockpit", "home"],
  ["bidroom", "Bid Room", "bidroom"],
  ["ops", "Rush & Split", "ops"],
  ["qcpack", "QC & Barcode", "qcpack"],
  ["stock", "Stock & Price", "stock"],
  ["intel", "Hot/Dead/Ghost", "intel"],
  ["crm", "Follow & Source", "crm"],
  ["sup", "Suppliers", "sup"],
  ["margins", "Slab Margins", "margins"],
  ["pay", "Payments", "pay"],
  ["controls", "250+ Controls", "controls"],
  ["staff", "Staff & Portals", "staff"]
];

$("#nav").innerHTML = NAV.map(function(n) { return "<button type='button' data-p='" + n[0] + "'><svg class='i' viewBox='0 0 24 24'>" + ICONS[n[2]] + "</svg>" + n[1] + "</button>"; }).join("");
$("#nav").onclick = function(e) { var b = e.target.closest("button"); if (b) go(b.dataset.p); };

function toast(msg) {
  var t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._tm); t._tm = setTimeout(function() { t.classList.remove("on"); }, 2800);
}

function getCreds() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (_) { return null; } }

async function api(path, body, isLogin) {
  var c = getCreds(); if (!c) return { ok: false, error: "Not logged in" };
  var headers = { "x-staff-phone": c.u, "x-staff-token": c.p };
  if (isLogin) headers["x-login-attempt"] = "1";
  var opt = { method: body ? "POST" : "GET", headers: headers };
  if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  try {
    var r = await fetch("/api/panel/" + path, opt);
    var txt = await r.text();
    try { return JSON.parse(txt); }
    catch (_) { return { ok: false, error: "API returned HTML instead of JSON. Check Worker route!" }; }
  } catch (netErr) {
    return { ok: false, error: "Network error: " + netErr.message };
  }
}

async function syncAll(silent, isLogin) {
  if (!silent) showLoader(isLogin ? "Authenticating..." : "Syncing Live Data...", "Fetching orders, stock, bids & security state");
  var d = await api("dashboard", null, isLogin);
  hideLoader();
  if (!d.ok) {
    if (!silent) toast("× " + (d.error || "Authentication failed"));
    return d;
  }
  STATE.orders = d.orders || [];
  STATE.payments = d.payments || [];
  STATE.suppliers = d.suppliers || [];
  STATE.items = d.items || [];
  STATE.bids = d.bids || [];
  STATE.customers = d.customers || [];
  STATE.staff_list = d.staff_list || [];
  STATE.margin_rules = d.margin_rules || [];
  STATE.inventory = d.inventory || [];
  STATE.inventory_logs = d.inventory_logs || [];
  STATE.ghost_queries = d.ghost_queries || [];
  STATE.settings = {};
  (d.settings || []).forEach(function(s) { STATE.settings[s.key] = s.value; });
  go(STATE.curPage, true);
  if (!silent && !isLogin) toast("★ Live Engine Synced");
  return d;
}

async function doLogin() {
  var u = $("#u").value.trim(), p = $("#p").value.trim();
  $("#err").textContent = "";
  if (!u || !p) { $("#err").textContent = "Please enter both Username/Phone and Token"; return; }
  localStorage.setItem(KEY, JSON.stringify({ u: u, p: p }));
  var res = await syncAll(false, true);
  if (res && res.ok) {
    $("#login").classList.add("out");
    setTimeout(function() { $("#login").style.display = "none"; }, 450);
    $("#app").classList.add("show");
    toast("★ Welcome! Login Alert sent to Logs Bot");
  } else {
    localStorage.removeItem(KEY);
    $("#err").textContent = (res && res.error) ? res.error : "Invalid Credentials";
    var box = $("#lbox"); box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  }
}

$("#u").addEventListener("keydown", function(e) { if (e.key === "Enter") { e.preventDefault(); $("#p").focus(); } });
$("#p").addEventListener("keydown", function(e) { if (e.key === "Enter") { e.preventDefault(); doLogin(); } });

$("#syncBtn").onclick = $("#syncBtn2").onclick = function() { syncAll(false, false); };
$("#theme").onclick = $("#theme2").onclick = function() {
  var r = document.documentElement;
  r.setAttribute("data-theme", r.getAttribute("data-theme") === "dark" ? "light" : "dark");
};
$("#lock").onclick = $("#lock2").onclick = function() { localStorage.removeItem(KEY); location.reload(); };

document.addEventListener("click", async function(e) {
  var tg = e.target.closest(".tog[data-k]");
  if (tg) {
    tg.classList.toggle("on");
    var k = tg.dataset.k, v = tg.classList.contains("on") ? "1" : "0";
    STATE.settings[k] = v;
    var body = {}; body[k] = v;
    await api("save-settings", body);
    toast("★ " + k + " = " + (v === "1" ? "ON" : "OFF"));
  }
});

function chip(t, c) { return "<span class='chip " + (c || "") + "'>" + t + "</span>"; }
function tog(k, def) {
  var val = STATE.settings[k] !== undefined ? STATE.settings[k] : (def || "1");
  return "<span class='tog " + (val === "1" ? "on" : "") + "' data-k='" + k + "'></span>";
}

var PAGES = {};

/* 2. LIVE BID ROOM + SUPPLIER RESPONSE-TIME LEADERBOARD (File 12 & 14) */
PAGES.bidroom = function() {
  var activeOrds = STATE.orders.filter(function(o) { return o.status === "BIDDING" || o.status === "NO_BIDS" || o.status === "QUOTED"; });
  var sortedSups = [...STATE.suppliers].sort(function(a, b) { return (a.avg_resp_sec || 45) - (b.avg_resp_sec || 45); });
  var curLogic = STATE.settings.allocation_logic || "cheapest";

  return `<div class="grid">
    <!-- File 14: Supplier Response Speed Trophy Leaderboard -->
    <div class="card c7">
      <h3>🏆 Supplier Speed Leaderboard (Fastest Response Time)</h3>
      <div class="grid" style="gap:10px">
        ${sortedSups.slice(0, 3).map(function(s, idx) {
          return `<div class="c4" style="padding:12px;border-radius:16px;box-shadow:var(--in)">
            <div style="font-weight:800;color:var(--deep)">#${idx + 1} ${s.name}</div>
            <div class="mute">Avg Speed: <b>${s.avg_resp_sec || 45}s</b> | Freq: ${s.orders_freq || 1} orders</div>
          </div>`;
        }).join("") || `<div class="c12 mute">Add suppliers to view leaderboard.</div>`}
      </div>
    </div>

    <!-- File 12: Allocation Logic Selector (Cheapest Price vs Highest Frequency) -->
    <div class="card c5">
      <h3>⚖️ Auto-Allocation Logic</h3>
      <div class="mute" style="margin-bottom:10px">Choose how the 30-min engine picks winning suppliers:</div>
      <div style="display:flex;gap:8px">
        <button type="button" class="act ${curLogic === 'cheapest' ? 'p' : ''}" style="flex:1" onclick="setAllocLogic('cheapest')">Cheapest Price</button>
        <button type="button" class="act ${curLogic === 'frequency' ? 'p' : ''}" style="flex:1" onclick="setAllocLogic('frequency')">Highest Frequency</button>
      </div>
    </div>

    <div class="card c12">
      <h3>★ Live Bid Room Radar ${chip(STATE.bids.filter(function(b) { return b.status === "SUBMITTED"; }).length + " Submitted Bids", "g")}</h3>
      ${activeOrds.map(function(o) {
        var ordItems = STATE.items.filter(function(i) { return i.order_id === o.id; });
        var remSecs = Math.max(0, o.bidding_ends_at - Math.floor(Date.now() / 1000));
        return `<div style="padding:16px;border-radius:20px;box-shadow:var(--in);margin-bottom:16px">
          <div class="row" style="border:0;padding-top:0">
            <div class="g1"><b>Order #${o.id} (${o.master_id || "Master"})</b> <span class="mute">Closes In: ${Math.floor(remSecs / 60)}m ${remSecs % 60}s</span></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              ${chip(o.status, o.status === "BIDDING" ? "a" : "g")}
              <button type="button" class="act" onclick="extendOrd(${o.id}, 15)">+15m Window</button>
              <button type="button" class="act p" onclick="forceCloseOrd(${o.id})">Finalize & Send Invoice</button>
            </div>
          </div>
          ${ordItems.map(function(it) {
            var itemBids = STATE.bids.filter(function(b) { return b.item_id === it.id; });
            var subBids = itemBids.filter(function(b) { return b.status === "SUBMITTED"; }).sort(function(a, b) { return a.price_per_unit - b.price_per_unit; });
            var cheapestId = subBids[0] ? subBids[0].id : null;
            return `<div style="margin-top:10px;padding:12px;border-radius:14px;background:var(--bg)">

                <table>

                  ${itemBids.map(function(b) { return `<tr>
                    <td><b>${b.sup_name || "Supplier #" + b.supplier_id}</b></td>
                    <td>${chip(b.status, b.status === "SUBMITTED" ? "g" : b.status === "DECLINED" ? "r" : "a")}</td>

};

/* 6. HOT vs DEAD STOCK INTELLIGENCE + MARKET vs INTERNAL PRICE + DEMO/GHOST INJECTOR (Files 11, 13) */
PAGES.intel = function() {
  var inv = STATE.inventory || [];
  var dailyPot = 0;
  inv.forEach(function(i) {
    var spread = Math.max(150, (Number(i.price) || 1000) - (Number(i.in_house_cost) || 750));
    dailyPot += spread * (Number(i.daily_freq) || 1.5);
  });
  var deadItems = inv.filter(function(i) { return Number(i.days_unsold) >= 90; });
  var deadCap = deadItems.reduce(function(a, i) { return a + (Number(i.good_qty) * Number(i.price)); }, 0);

  return `<div class="grid">
    <div class="card c3"><div class="mute">Daily In-House Potential</div><div class="big">₹${Math.round(dailyPot).toLocaleString("en-IN")}</div><div class="mute">Hot Stock Margin</div></div>

/* 7. 7/14/21+ DAYS FOLLOW-UP KANBAN + OUT-OF-ODISHA SOURCING (Files 6, 8) */
PAGES.crm = function() {
  var nowSec = Math.floor(Date.now() / 1000);
  var col7 = [], col14 = [], col21 = [];
  STATE.orders.forEach(function(o) {
    var days = Math.floor(Math.max(0, nowSec - (o.created_at || nowSec)) / 86400);
    if (o.force_followup) col7.push({ o: o, days: days, forced: true });
    else if (days < 14) col7.push({ o: o, days: days, forced: false });
    else if (days < 21) col14.push({ o: o, days: days, forced: false });
    else col21.push({ o: o, days: days, forced: false });
  });

  function renderFollowCol(list, title, badgeCol) {
    return `<div class="card c4">
      <h3>${title} ${chip(list.length, badgeCol)}</h3>
      ${list.slice(0, 8).map(function(x) {
        var o = x.o;
        var cleanPh = String(o.customer_id).replace(/\D/g, "");
        var waTxt = encodeURIComponent("Hi, checking in from AD PARTSOL regarding your Order #" + o.id + ". Do you need any mobile spare parts today?");
        return `<div style="padding:12px;border-radius:16px;box-shadow:var(--in);margin-bottom:10px">

            <button type="button" class="act" style="flex:1" onclick="sendQuickRemind('${o.customer_id}', ${o.id})">Bot Ping</button>

  }

  return `<div class="grid">
    <div class="card c12">
      <h3>✈️ Out-of-Odisha Sourcing Desk (Option A: Available Only vs Option B: Delhi / Mumbai / Kolkata / Raigarh)</h3>

        <button type="button" class="act" onclick="triggerOutsource('broadcast_region')">2. Broadcast to Selected State</button>
      </div>
    </div>

    ${renderFollowCol(col7, "1st Follow-Up (0–7 Days / Pinned)", "g")}
    ${renderFollowCol(col14, "2nd Follow-Up (14 Days)", "a")}

/* 8. MEGA SUPPLIERS PAGE */
PAGES.sup = function() {
  var supStats = STATE.suppliers.map(function(s) {
    var sBids = STATE.bids.filter(function(b) { return b.supplier_id === s.id; });
    var sub = sBids.filter(function(b) { return b.status === "SUBMITTED"; });
    var dec = sBids.filter(function(b) { return b.status === "DECLINED"; });
    var wonCount = 0;
    STATE.items.forEach(function(it) {
      var al = JSON.parse(it.allocated_json || "[]");
      if (al.some(function(a) { return a.supplier_id === s.id; })) wonCount++;
    });
    var avgPrice = sub.length ? Math.round(sub.reduce(function(a, b) { return a + Number(b.price_per_unit || 0); }, 0) / sub.length) : 0;
    return Object.assign({}, s, { total_req: sBids.length, accepted: sub.length, declined: dec.length, won: wonCount, avgPrice: avgPrice });
  });

  var maxWon = Math.max.apply(null, [1].concat(supStats.map(function(s) { return s.accepted; })));

  return `<div class="grid">
    <div class="card c7">
      <h3>📈 Supplier Growth & Bid Acceptance Graph</h3>
      <div class="bars">
        ${supStats.map(function(s) {
          var h = Math.max(12, Math.round((s.accepted / maxWon) * 100));
          return `<div><span style="font-weight:800;color:var(--deep)">${s.accepted}</span><i style="height:${h}%"></i><b>${s.name.slice(0, 10)}</b></div>`;

          <option value="Odisha">Odisha (Local)</option>
          <option value="Delhi">Delhi</option>
          <option value="Mumbai">Mumbai</option>
          <option value="Kolkata">Kolkata</option>
          <option value="Raigarh">Raigarh</option>

    <div class="card c12">
      <h3>Supplier Eligibility, Cheapest Selection Scorecard & Portal Links</h3>
      <div class="scroll">
        <table>
          <tr><th>ID & Name</th><th>Region</th><th>Status</th><th>Speed</th><th>Accepted (✅)</th><th>Declined (❌)</th><th>Won</th><th>Verify Code & Portal</th></tr>

      <h3>Live Feature Switches (Instant Sync)</h3>
      ${cat.toggles.map(function(t) { return `<div class="row">
        <div class="g1"><b>${t[1]}</b><span class="mute">Switch: ${t[0]}</span></div>

      </div>`; }).join("")}
    </div>
  </div>`;
};

function go(p, skipScroll) {
  STATE.curPage = p;
  document.querySelectorAll("#nav button").forEach(function(b) { b.classList.toggle("on", b.dataset.p === p); });
  $("#view").innerHTML = PAGES[p] ? PAGES[p]() : PAGES.home();
  if (!skipScroll) scrollTo(0, 0);
}

/* ALL LIVE ACTIONS */
async function assignSup() {
  var order_id = $("#asgOrd").value.trim(), supplier_id = $("#asgSup").value, unit_price = $("#asgPrice").value.trim();
  if (!order_id || !supplier_id) return toast("Select Order & Supplier");
  showLoader("Assigning Supplier...", "Sending itemized invoice & supplier notice");
  var r = await api("assign-supplier", { order_id: order_id, supplier_id: supplier_id, unit_price: unit_price });
  hideLoader(); toast(r.msg || r.error); await syncAll(true);
}
async function quickPickSup(order_id, supplier_id, unit_price) {
  showLoader("Selecting Winner...", "Calculating slab margins & dispatching invoice");
  var r = await api("assign-supplier", { order_id: order_id, supplier_id: supplier_id, unit_price: unit_price });
  hideLoader(); toast(r.msg || "Winner Selected!"); await syncAll(true);
}
async function setAllocLogic(logic) {
  STATE.settings.allocation_logic = logic;
  await api("save-settings", { allocation_logic: logic });
  toast("★ Allocation Logic set to: " + logic.toUpperCase());
  go("bidroom", true);
}
async function forceCloseAll() {
  showLoader("Closing Bidding Windows...", "Running fractional split & slab margin engine");
  var r = await api("force-close", {}); hideLoader(); toast(r.msg); await syncAll(true);
}
async function forceCloseOrd(order_id) {
  showLoader("Finalizing Order #" + order_id, "Generating itemized customer invoice");
  var r = await api("force-close", { order_id: order_id }); hideLoader(); toast(r.msg); await syncAll(true);
}
async function extendOrd(order_id, mins) {
  var r = await api("extend-window", { order_id: order_id, mins: mins }); toast(r.msg); await syncAll(true);
}
async function addMarginSlab() {
  var min_price = $("#mMin").value, max_price = $("#mMax").value, margin_type = $("#mType").value, margin_value = $("#mVal").value;
  showLoader("Saving Price Slab...", "Checking for range overlaps");
  var r = await api("add-margin-rule", { min_price: min_price, max_price: max_price, margin_type: margin_type, margin_value: margin_value });
  hideLoader();
  if (!r.ok) return toast("× " + r.error);
  toast("★ " + r.msg); await syncAll(true);
}
async function delMarginSlab(id) {
  await api("delete-margin-rule", { id: id }); toast("Slab deleted"); await syncAll(true);
}
async function saveFallbackMargin() {
  showLoader("Saving Delivery & Margin...");
  await api("save-settings", { delivery_charge: $("#fDeliv").value, margin_percent: $("#fMarg").value, rounding_step: $("#fRound").value });
  hideLoader(); toast("★ Delivery & Fallback Saved"); await syncAll(true);
}
async function saveCtrlInputs() {
  var body = {};
  document.querySelectorAll(".ctrl-inp").forEach(function(el) { body[el.dataset.k] = el.value.trim(); });
  showLoader("Saving Flight Controls...", "Updating live D1 parameters");
  await api("save-settings", body);
  hideLoader(); toast("★ Category Parameters Saved!"); await syncAll(true);
}
async function createSup() {
  var name = $("#newSupName").value.trim(), phone = $("#newSupPhone").value.trim(), region = $("#newSupRegion").value;
  if (!name) return toast("Enter supplier name");
  showLoader("Creating Supplier Code...");
  var r = await api("add-supplier", { name: name, phone: phone, region: region });
  hideLoader(); toast(r.msg); await syncAll(true);
}
async function payAct(payment_id, decision) {
  showLoader("Updating Payment Status...");
  await api("payment-action", { payment_id: payment_id, decision: decision });
  hideLoader(); toast("★ Payment " + decision); await syncAll(true);
}
async function shipOrd(order_id) {
  var tracking_id = $("#trk_" + order_id).value.trim();
  if (!tracking_id) return toast("Enter Tracking ID");
  showLoader("Dispatching Order #" + order_id, "Sending tracking ID to customer");
  var r = await api("ship-order", { order_id: order_id, tracking_id: tracking_id });
  hideLoader(); toast(r.msg); await syncAll(true);
}
async function sendQuickRemind(customer_id, order_id) {
  showLoader("Sending Bot Follow-Up...");
  var r = await api("send-chat", { customer_id: customer_id, text: "Reminder regarding your Order #" + order_id + ". Reply here if you need any assistance or wish to confirm your order!" });
  hideLoader(); toast(r.msg || "Follow-up sent!");
}
async function createStaff() {
  var role = $("#stRole").value, phone = $("#stPhone").value.trim();
  if (!phone) return toast("Enter username/phone");
  showLoader("Generating Staff Token...");
  var r = await api("add-staff", { role: role, phone: phone });
  hideLoader(); toast(r.msg); await syncAll(true);
}
async function delStaff(id) {
  await api("delete-staff", { id: id }); toast("Staff user removed"); await syncAll(true);
}
async function scanUpdateStage(stage) {
  var id = $("#scanOrdId").value.trim();
  if (!id) return toast("Scan or enter Order ID first!");
  showLoader("Updating Logistics Stage...", stage);
  var r = await api("scan-stage", { order_id: id, stage: stage });
  hideLoader(); toast(r.msg || r.error); await syncAll(true);
}
async function qcDecision(stage) {
  var id = $("#qcOrdId").value.trim(), reason = $("#qcReason").value.trim();
  if (!id) return toast("Enter Order ID");
  showLoader("Submitting QC Report...");
  var r = await api("scan-stage", { order_id: id, stage: stage, hold_reason: reason });
  hideLoader(); toast(r.msg || r.error);
  if (stage === "ON_HOLD") printThermalSlip(id, "RE-COLLECT SLIP (ON HOLD)");
  await syncAll(true);
}
async function runBulkMultiplier() {
  var cat = $("#bulkCat").value, mode = $("#bulkMode").value, val = $("#bulkVal").value;
  if (!val) return toast("Enter increase value");
  if (cat === "All Categories" && !confirm("WARNING: Global Update! Change price of EVERY item in inventory?")) return;
  showLoader("Applying Bulk Price Multiplier...");
  var r = await api("bulk-price-update", { category: cat, mode: mode, value: val });
  hideLoader(); toast(r.msg || r.error); await syncAll(true);
}
async function commitStockDOA() {
  var name = $("#stName").value.trim(), cat = $("#stCat").value, price = $("#stPrice").value, good = $("#stGood").value, faulty = $("#stFaulty").value;
  if (!name) return toast("Enter Part Name");
  showLoader("Updating Master Inventory & Audit Log...");
  var r = await api("adjust-stock", { name: name, category: cat, price: price, good_delta: good, faulty_delta: faulty });
  hideLoader(); toast(r.msg); await syncAll(true);
}
async function injectGhostQuery() {
  var mode = $("#ghMode").value, item_name = $("#ghItem").value.trim(), qty = $("#ghQty").value, note = $("#ghNote").value.trim();
  if (!item_name) return toast("Enter item name");
  showLoader("Injecting Query...", mode.toUpperCase());
  var r = await api("inject-query", { mode: mode, item_name: item_name, qty: qty, note: note });
  hideLoader(); toast(r.msg); await syncAll(true);
}
async function triggerOutsource(mode) {
  var order_id = $("#outOrdId").value.trim(), region = $("#outState").value;
  if (!order_id) return toast("Enter Order ID");
  showLoader("Processing Outsource Action...");
  var r = await api("outsource-options", { order_id: order_id, mode: mode, region: region });
  hideLoader(); toast(r.msg || r.error); await syncAll(true);
}
async function pinFollowUp(order_id) {
  var r = await api("force-followup", { order_id: order_id });
  toast(r.msg); await syncAll(true);
}
function printThermalSlip(orderId, titleOverride) {
  var o = STATE.orders.find(function(x) { return String(x.id) === String(orderId); }) || { id: orderId, customer_id: "Customer", final_total: 0 };
  var its = STATE.items.filter(function(i) { return String(i.order_id) === String(orderId); });
  var itemLines = its.map(function(i) {
    var al = JSON.parse(i.allocated_json || "[]").map(function(a) { return a.name; }).join(", ");
    return "<div style='margin:6px 0;border-bottom:1px dashed #ccc;padding-bottom:4px'>[ ] <b>" + i.req_qty + "x " + i.brand + " " + (i.model || "") + " " + i.part_name + "</b> (" + (i.variant || "Std") + ")<br><small>Pickup: " + (al || "Warehouse/Supplier") + "</small></div>";
  }).join("");

  var w = window.open("", "_blank", "width=380,height=600");
  w.document.write("<html><head><title>Slip #" + o.id + "</title></head><body style='font-family:monospace;width:78mm;margin:0 auto;padding:10px;color:#000'>" +
    "<div style='text-align:center;border-bottom:2px dashed #000;padding-bottom:8px;margin-bottom:8px'>" +
    "<h2 style='margin:0'>AD PARTSOL</h2><div style='font-size:11px'>" + (titleOverride || "COLLECTION & FULFILLMENT SLIP") + "</div>" +
    "<div style='font-size:11px'>Date: " + new Date().toLocaleString("en-IN") + "</div></div>" +
    "<div><b>Order ID: #" + o.id + "</b></div><div>Customer: " + o.customer_id + "</div>" +
    (o.hold_reason ? "<div style='background:#000;color:#fff;padding:4px;margin:6px 0;font-size:11px'>HOLD: " + o.hold_reason + "</div>" : "") +
    "<div style='margin-top:10px;font-weight:bold;text-decoration:underline'>ITEMS CHECKLIST:</div>" +
    (itemLines || "<div>[ ] Spare Parts Order #" + o.id + "</div>") +
    "<div style='margin-top:12px;border-top:2px dashed #000;padding-top:8px;text-align:center'>" +
    "<div style='font-size:14px;font-weight:bold'>TOTAL: Rs." + (o.final_total || 0) + "</div>" +
    "<div style='font-size:22px;letter-spacing:3px;margin-top:8px'>*" + o.id + "*</div>" +
    "<div style='font-size:10px'>VERIFIED BY AD PARTSOL ENGINE</div></div>" +
    "<script>setTimeout(function(){window.print();},300);<\/script></body></html>");
  w.document.close();
}
async function emergencyStop() {
  if (!confirm("Pause all Bots immediately?")) return;
  showLoader("ACTIVATING EMERGENCY STOP...");
  await api("save-settings", { tg_enabled: "0", wa_enabled: "0", ai_enabled: "0" });
  hideLoader(); toast("★ EMERGENCY STOP ACTIVATED"); await syncAll(true);
}
function filterRows(q) {
  q = q.toLowerCase();
  document.querySelectorAll(".row, tr").forEach(function(el) {
    if (el.tagName === "TR" && el.querySelector("th")) return;
    el.style.display = el.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}

if (getCreds()) {
  $("#login").style.display = "none";
  $("#app").classList.add("show");
  syncAll(false, false);
}
