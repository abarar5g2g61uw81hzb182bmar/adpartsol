<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AD PartSol — Payment Verification Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e3e8f4;--hi:#ebeffa;--lo:#d8dfee;--sd:rgba(146,160,198,.78);--sl:rgba(255,255,255,.95);--ink:#2e3c5f;--mute:#70809f;--deep:#4a8af0;--red:#e0524a;--green:#25a862;--rz:9px 9px 20px var(--sd),-9px -9px 20px var(--sl);--in:inset 5px 5px 11px var(--sd),inset -5px -5px 11px var(--sl);--cv:linear-gradient(145deg,var(--hi),var(--lo))}
*{box-sizing:border-box}body{margin:0;font-family:"Plus Jakarta Sans",sans-serif;background:var(--bg);color:var(--ink);padding:16px}
.wrap{max-width:720px;margin:0 auto}.card{background:var(--cv);border-radius:24px;padding:18px;box-shadow:var(--rz);margin-bottom:16px}
.inbox{background:var(--bg);box-shadow:var(--in);border:0;border-radius:14px;padding:14px;width:100%;font-size:16px;margin-bottom:12px;outline:0}
.btn{padding:13px 18px;border-radius:14px;border:0;font-weight:800;cursor:pointer;background:linear-gradient(145deg,#7db4ff,#4a8af0);color:#fff;width:100%}
.shot{height:220px;background:#090d16;border-radius:16px;overflow:hidden;margin:12px 0;display:grid;place-items:center}
.shot img{width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginBox" class="card">
    <h2 style="margin:0 0 12px">★ Payment Manager Login</h2>
    <input id="u" class="inbox" placeholder="Staff Phone Number">
    <input id="p" type="password" class="inbox" placeholder="ADP-Token">
    <button class="btn" onclick="login()">Enter Payment Desk</button>
  </div>
  <div id="app" style="display:none">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0;font-size:18px">★ Payment Verification Queue</h2>
      <button onclick="load()" style="padding:8px 14px;border-radius:12px;border:0;box-shadow:var(--in);font-weight:700">↻ Sync</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
let C = JSON.parse(localStorage.getItem("adp_pay_c") || "null");
if (C) load();
function login() { C = { u: document.getElementById("u").value.trim(), p: document.getElementById("p").value.trim() }; localStorage.setItem("adp_pay_c", JSON.stringify(C)); load(); }
async function load() {
  const r = await fetch("/api/panel/dashboard", { headers: { "x-staff-phone": C.u, "x-staff-token": C.p } });
  const d = await r.json();
  if (!d.ok) { localStorage.removeItem("adp_pay_c"); return alert(d.error); }
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";
  const pend = (d.payments || []).filter(x => x.status === "PENDING");
  document.getElementById("list").innerHTML = pend.map(x => `
    <div class="card">
      <div style="display:flex;justify-content:space-between"><b>Order #${x.order_id} (${x.type})</b><b style="color:var(--deep)">Expected: ₹${x.expected_amount}</b></div>
      <div style="font-size:12.5px;color:var(--mute);margin-top:4px">AI UTR: <b>${x.extracted_utr}</b> | Detected: ₹${x.extracted_amount || "?"}</div>
      <div class="shot"><a href="${x.file_id_or_url}" target="_blank"><img src="${x.file_id_or_url}"></a></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button class="btn" style="background:var(--green)" onclick="act(${x.id},'APPROVED')">✓ Approve</button>
        <button class="btn" style="background:var(--red)" onclick="act(${x.id},'REJECTED')">✕ Reject</button>
      </div>
    </div>
  `).join("") || `<div class="card">No pending payment screenshots.</div>`;
}
async function act(payment_id, decision) {
  await fetch("/api/panel/payment-action", { method: "POST", headers: { "Content-Type": "application/json", "x-staff-phone": C.u, "x-staff-token": C.p }, body: JSON.stringify({ payment_id, decision }) });
  load();
}
</script>
</body>
</html>
