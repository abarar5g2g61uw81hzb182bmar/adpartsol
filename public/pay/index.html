<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AD PartSol — Payment Verification Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#FFFFFF;--bg:#F8F8F8;--cv:#FFFFFF;--ink:#080808;--mute:#777777;--line:#EAEAEA;--hover:#F3F3F3;--inv:#FFFFFF;--red:#B3261E;--green:#1E7347;--amber:#8A6414;--r:10px;--rc:14px}
:root[data-theme="dark"]{--page:#080808;--bg:#121212;--cv:#0E0E0E;--ink:#F2F2F2;--mute:#8C8C8C;--line:#262626;--hover:#1A1A1A;--inv:#080808;--red:#F0716A;--green:#4FC083;--amber:#D9A441;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font-family:"Inter",system-ui,sans-serif;background:var(--page);color:var(--ink);padding:20px 14px 60px;font-size:14px}
.wrap{max-width:960px;margin:0 auto}.card{background:var(--cv);border:1px solid var(--line);border-radius:var(--rc);padding:20px;margin-bottom:16px}
.inbox{background:var(--cv);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;width:100%;font-size:15px;margin-bottom:12px;outline:0;color:var(--ink)}
.btn{padding:12px 16px;border-radius:var(--r);border:1px solid var(--ink);font-weight:600;cursor:pointer;background:var(--ink);color:var(--inv);width:100%}
.shot{height:220px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:12px 0;display:grid;place-items:center}
.shot img{width:100%;height:100%;object-fit:contain}
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{padding:7px 14px;border-radius:99px;border:0;background:none;color:var(--mute);font-weight:500;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--inv)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.chip{padding:3px 9px;border-radius:99px;font-size:11px;border:1px solid var(--line);background:var(--bg)}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginBox" class="card" style="max-width:400px;margin:60px auto">
    <h2 style="margin:0 0 6px">Payment Verification Desk</h2>
    <p style="color:var(--mute);font-size:12.5px;margin:0 0 18px">Sign in with Payment Manager credentials</p>
    <input id="u" class="inbox" placeholder="Staff Phone / Username">
    <input id="p" type="password" class="inbox" placeholder="ADP-Token / Password">
    <button class="btn" onclick="login()">Enter Payment Desk</button>
  </div>

  <div id="app" style="display:none">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div>
        <h2 style="margin:0;font-size:20px">Payment Verification Queue</h2>
        <div style="font-size:12px;color:var(--mute)" id="subStats">20% Advance & 80% Balance Screenshots</div>
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')" class="chip" style="cursor:pointer;padding:8px 12px">◐ Theme</button>
        <button onclick="load()" class="chip" style="cursor:pointer;padding:8px 12px">↻ Sync</button>
        <button onclick="localStorage.removeItem('adp_pay_c');location.reload()" class="chip" style="cursor:pointer;padding:8px 12px;color:var(--red)">Logout</button>
      </div>
    </div>

    <div class="tabs">
      <button id="tb_PENDING" class="on" onclick="setFilter('PENDING')">Pending Queue</button>
      <button id="tb_APPROVED" onclick="setFilter('APPROVED')">Approved</button>
      <button id="tb_REJECTED" onclick="setFilter('REJECTED')">Rejected / Fraud</button>
    </div>

    <div class="grid" id="list"></div>
  </div>
</div>
<script>
const API_BASE = location.hostname.includes("workers.dev") ? "" : "https://adpartsol.storzen-io.workers.dev";
let C = JSON.parse(localStorage.getItem("adp_pay_c") || "null");
let PAYS = [], FILTER = "PENDING";
if (C) load();

function login() {
  C = { u: document.getElementById("u").value.trim(), p: document.getElementById("p").value.trim() };
  localStorage.setItem("adp_pay_c", JSON.stringify(C));
  load();
}
function setFilter(f) {
  FILTER = f;
  ["PENDING","APPROVED","REJECTED"].forEach(k => document.getElementById("tb_"+k).classList.toggle("on", k===f));
  render();
}
async function load() {
  const r = await fetch(API_BASE + "/api/panel/dashboard", { headers: { "x-staff-phone": C.u, "x-staff-token": C.p } });
  const d = await r.json();
  if (!d.ok) { localStorage.removeItem("adp_pay_c"); return alert(d.error || "Invalid credentials"); }
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";
  PAYS = d.payments || [];
  render();
}
function render() {
  const list = PAYS.filter(x => x.status === FILTER);
  document.getElementById("list").innerHTML = list.map(x => {
    const match = Number(x.extracted_amount) === Number(x.expected_amount);
    return `<div class="card" style="margin:0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <b>Order #${x.order_id}</b>
        <span class="chip">${x.type}</span>
      </div>
      <div style="font-size:24px;font-weight:700;letter-spacing:-.03em">Expected: ₹${x.expected_amount}</div>
      <div style="font-size:12px;color:var(--mute);margin-top:4px">
        AI UTR: <b>${x.extracted_utr || "Manual"}</b> • AI Read: <b style="color:${match ? "var(--green)" : "var(--amber)"}">₹${x.extracted_amount || "?"}</b>
      </div>
      <div class="shot"><a href="${x.file_id_or_url}" target="_blank"><img src="${x.file_id_or_url}"></a></div>
      ${x.status === "PENDING" ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn" style="background:var(--green);border-color:var(--green)" onclick="act(${x.id},'APPROVED')">✓ Approve</button>
        <button class="btn" style="background:var(--cv);color:var(--red);border-color:var(--red)" onclick="act(${x.id},'REJECTED')">✕ Reject</button>
      </div>` : `<div class="chip">${x.status}</div>`}
    </div>`;
  }).join("") || `<div class="card" style="grid-column:1/-1;color:var(--mute)">No payments in ${FILTER} queue.</div>`;
}
async function act(payment_id, decision) {
  await fetch(API_BASE + "/api/panel/payment-action", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-staff-phone": C.u, "x-staff-token": C.p },
    body: JSON.stringify({ payment_id, decision })
  });
  load();
}
</script>
</body>
</html>
