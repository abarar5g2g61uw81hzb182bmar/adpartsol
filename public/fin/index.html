<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AD PartSol — Accountant & Finance Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#FFFFFF;--bg:#F8F8F8;--cv:#FFFFFF;--ink:#080808;--mute:#777777;--line:#EAEAEA;--inv:#FFFFFF;--green:#1E7347;--r:10px;--rc:14px}
*{box-sizing:border-box}body{margin:0;font-family:"Inter",system-ui,sans-serif;background:var(--page);color:var(--ink);padding:20px 14px 60px;font-size:14px}
.wrap{max-width:1140px;margin:0 auto}.card{background:var(--cv);border:1px solid var(--line);border-radius:var(--rc);padding:20px;margin-bottom:16px}
.inbox{background:var(--cv);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;width:100%;font-size:14px;outline:0;color:var(--ink)}
.act{padding:10px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--cv);font-weight:600;font-size:12.5px;cursor:pointer}
.act.p{background:var(--ink);color:var(--inv);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginBox" class="card" style="max-width:400px;margin:50px auto">
    <h2 style="margin:0 0 8px">Finance & Profit Ledger</h2>
    <input id="u" class="inbox" style="margin-bottom:10px" placeholder="Accountant Phone">
    <input id="p" type="password" class="inbox" style="margin-bottom:14px" placeholder="ADP-Token">
    <button class="act p" style="width:100%" onclick="login()">Enter Finance Desk</button>
  </div>
  <div id="app" style="display:none">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <h2 style="margin:0;font-size:20px">Money Home, Supplier Payables & Profit Ledger</h2>
      <div style="display:flex;gap:8px">
        <button class="act p" onclick="exportCSV()">⬇ Export CA CSV</button>
        <button class="act" onclick="load()">↻ Sync</button>
      </div>
    </div>
    <div id="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px"></div>
    <div class="card" id="ledger"></div>
  </div>
</div>
<script>
const API_BASE = location.hostname.includes("workers.dev") ? "" : "https://adpartsol.storzen-io.workers.dev";
let C = JSON.parse(localStorage.getItem("adp_fin_c") || "null");
let ORDS = [];
if (C) load();
function login() { C = { u: document.getElementById("u").value.trim(), p: document.getElementById("p").value.trim() }; localStorage.setItem("adp_fin_c", JSON.stringify(C)); load(); }
async function load() {
  const r = await fetch(API_BASE + "/api/panel/dashboard", { headers: { "x-staff-phone": C.u, "x-staff-token": C.p } });
  const d = await r.json();
  if (!d.ok) { localStorage.removeItem("adp_fin_c"); return alert(d.error); }
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";
  ORDS = d.orders || [];
  const adv = ORDS.reduce((a, o) => a + (Number(o.advance_20) || 0), 0);
  const bal = ORDS.reduce((a, o) => a + (Number(o.balance_80) || 0), 0);
  const cost = ORDS.reduce((a, o) => a + (Number(o.supplier_base_total) || 0), 0);
  const rev = ORDS.reduce((a, o) => a + (Number(o.final_total) || 0), 0);

  document.getElementById("stats").innerHTML = `
    <div class="card" style="margin:0"><div style="color:var(--mute);font-size:12px">Gross Billed</div><div style="font-size:24px;font-weight:700">₹${rev.toLocaleString("en-IN")}</div></div>
    <div class="card" style="margin:0"><div style="color:var(--mute);font-size:12px">20% Advance Pool</div><div style="font-size:24px;font-weight:700">₹${adv.toLocaleString("en-IN")}</div></div>
    <div class="card" style="margin:0"><div style="color:var(--mute);font-size:12px">80% Balance Pool</div><div style="font-size:24px;font-weight:700">₹${bal.toLocaleString("en-IN")}</div></div>
    <div class="card" style="margin:0"><div style="color:var(--mute);font-size:12px">Net Spread + Freight</div><div style="font-size:24px;font-weight:700;color:var(--green)">₹${Math.max(0, rev - cost).toLocaleString("en-IN")}</div></div>
  `;

  document.getElementById("ledger").innerHTML = `<table><tr><th>Order ID</th><th>Customer</th><th>Status</th><th>Supplier Cost</th><th>Delivery</th><th>Customer Total</th><th>Net Spread</th></tr>` +
    ORDS.map(o => `<tr><td><b>#${o.id}</b></td><td>${o.customer_id}</td><td>${o.status}</td><td>₹${o.supplier_base_total || 0}</td><td>₹${o.delivery_charge || 0}</td><td><b>₹${o.final_total || 0}</b></td><td style="color:var(--green);font-weight:600">₹${Math.max(0, (o.final_total || 0) - (o.supplier_base_total || 0))}</td></tr>`).join("") + `</table>`;
}
function exportCSV() {
  let csv = "Order_ID,Customer,Status,Supplier_Cost,Delivery,Final_Total,Advance_20,Balance_80\n";
  ORDS.forEach(o => { csv += `${o.id},${o.customer_id},${o.status},${o.supplier_base_total||0},${o.delivery_charge||0},${o.final_total||0},${o.advance_20||0},${o.balance_80||0}\n`; });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "AD_PartSol_Finance_Ledger.csv";
  a.click();
}
</script>
</body>
</html>
