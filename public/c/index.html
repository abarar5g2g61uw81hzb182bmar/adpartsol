<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AD PARTSOL - Track Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4">
  <div class="max-w-lg mx-auto mt-12 bg-slate-900 p-6 rounded-xl border border-slate-800">
    <h1 class="text-2xl font-bold text-amber-400 mb-2">🔎 AD PARTSOL Order Tracker</h1>
    <p class="text-xs text-slate-400 mb-4">Enter your Order ID to check real-time bidding, packing & dispatch status.</p>
    <div class="flex gap-2 mb-6">
      <input id="ordId" type="number" placeholder="Order ID (e.g. 1)" class="flex-1 p-3 bg-slate-950 rounded border border-slate-700">
      <button onclick="track()" class="bg-amber-500 text-black font-bold px-6 rounded">Track</button>
    </div>
    <div id="result"></div>
  </div>
  <script>
    async function track() {
      const id = document.getElementById('ordId').value.trim();
      if (!id) return;
      const res = await fetch('/api/panel/track?order_id=' + id);
      const data = await res.json();
      if (!data.ok) {
        document.getElementById('result').innerHTML = `<div class="text-rose-400 text-sm">Order #${id} not found.</div>`;
        return;
      }
      const o = data.order;
      document.getElementById('result').innerHTML = `
        <div class="p-4 bg-slate-950 rounded-lg border border-slate-800 space-y-2">
          <div class="flex justify-between"><span class="font-bold">Order #${o.id}</span><span class="text-amber-400 font-bold">${o.status}</span></div>
          <div class="text-sm text-slate-300">Total Amount: ₹${o.final_total || 'Calculating...'}</div>
          ${o.tracking_id ? `<div class="p-2 bg-emerald-500/20 text-emerald-300 rounded text-sm font-bold">🚚 Tracking ID: ${o.tracking_id}</div>` : ''}
        </div>
      `;
    }
  </script>
</body>
</html>
