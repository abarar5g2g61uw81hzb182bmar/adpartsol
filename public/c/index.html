<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AD PartSol — B2B Order & Tracking Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e3e8f4;--hi:#ebeffa;--lo:#d8dfee;--sd:rgba(146,160,198,.78);--sl:rgba(255,255,255,.95);--ink:#2e3c5f;--mute:#70809f;--teal:#5b9dff;--deep:#4a8af0;--green:#25a862;--rz:9px 9px 20px var(--sd),-9px -9px 20px var(--sl);--rs:5px 5px 11px var(--sd),-5px -5px 11px var(--sl);--in:inset 5px 5px 11px var(--sd),inset -5px -5px 11px var(--sl);--cv:linear-gradient(145deg,var(--hi),var(--lo))}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",sans-serif;color:var(--ink);background:var(--bg);padding:20px 14px 70px}
.wrap{max-width:580px;margin:0 auto}
.card{background:var(--cv);border-radius:28px;padding:24px;box-shadow:var(--rz);margin-bottom:20px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tabs button{flex:1;padding:12px;border-radius:99px;border:0;background:var(--cv);box-shadow:var(--rs);font:inherit;font-weight:700;font-size:13px;color:var(--mute);cursor:pointer}
.tabs button.on{box-shadow:var(--in);color:var(--deep)}
.inbox{background:var(--bg);box-shadow:var(--in);border:0;border-radius:16px;padding:14px 16px;color:var(--ink);font:inherit;font-weight:600;outline:0;width:100%;margin-bottom:12px}
.btn{width:100%;padding:16px;border-radius:18px;border:0;background:linear-gradient(145deg,#7db4ff,#4a8af0);color:#fff;font:inherit;font-weight:800;cursor:pointer;box-shadow:6px 6px 14px var(--sd),-4px -4px 10px var(--sl)}
.lbl{font-size:11.5px;font-weight:700;color:var(--mute);margin-bottom:5px;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button id="t1" class="on" onclick="showTab(1)">1. Shop Setup</button>
    <button id="t2" onclick="showTab(2)">2. Order Form</button>
    <button id="t3" onclick="showTab(3)">3. Track Order</button>
  </div>

  <!-- STEP 1: REGISTRATION FORM -->
  <div id="sec1" class="card">
    <h2 style="margin:0 0 6px">★ Step 1: Quick Shop Registration</h2>
    <p style="font-size:13px;color:var(--mute);margin:0 0 18px">Fill your delivery details once for instant wholesale quotes.</p>
    <label class="lbl">FULL NAME / SHOP NAME *</label>
    <input id="fName" class="inbox" placeholder="e.g. Abrar Mobile Care">
    <label class="lbl">10-DIGIT WHATSAPP / PHONE NUMBER *</label>
    <input id="fPhone" class="inbox" type="tel" placeholder="e.g. 8637213741">
    <label class="lbl">COMPLETE DELIVERY ADDRESS & PIN CODE *</label>
    <input id="fAddr" class="inbox" placeholder="Shop/Street, Locality, District, PIN">
    <label class="lbl">PREFERRED CHAT LANGUAGE *</label>
    <select id="fLang" class="inbox">
      <option value="hinglish">Hinglish (Hindi + English)</option>
      <option value="english">English</option>
      <option value="hindi">Hindi (हिन्दी)</option>
      <option value="odia">Odia (ଓଡ଼ିଆ)</option>
      <option value="odia_eng">Odia + English</option>
    </select>
    <label class="lbl">EMAIL ADDRESS (OPTIONAL — FOR WHOLESALE OFFERS)</label>
    <input id="fEmail" class="inbox" type="email" placeholder="optional@shop.com">
    <button class="btn" onclick="submitStep1()">Save Profile & Unlock VIP Pass →</button>
  </div>

  <!-- STEP 2: BRIDGE VIP PASS + REQUIREMENTS FORM -->
  <div id="sec2" class="card" style="display:none">
    <div id="vipBridge" style="padding:14px;border-radius:18px;box-shadow:var(--in);margin-bottom:18px;font-size:13px">
      <b>★ Verified AD PartSol Partner</b><br>
      <span style="color:var(--mute)">You can either return to WhatsApp/Telegram to send a Voice Note or Photo, OR add parts right below:</span>
    </div>
    <h3 style="margin:0 0 14px">★ Add Required Spare Parts</h3>
    <div id="itemsContainer"></div>
    <button onclick="addItemRow()" style="width:100%;padding:12px;border-radius:14px;border:0;box-shadow:var(--rs);background:var(--cv);font-weight:700;margin-bottom:14px;cursor:pointer">[+] Add Another Part</button>
    <button class="btn" onclick="submitOrderForm()">Submit Order Request →</button>
  </div>

  <!-- STEP 3: 9-DIGIT ORDER TRACKER -->
  <div id="sec3" class="card" style="display:none">
    <h2 style="margin:0 0 8px">★ Track 9-Digit Order ID</h2>
    <input id="trkId" class="inbox" type="number" placeholder="Enter 9-Digit Order ID">
    <button class="btn" onclick="trackNow()">Check Live Status</button>
    <div id="trkOut" style="margin-top:18px"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
let CID = params.get("cid") || localStorage.getItem("adp_cid") || "";

function showTab(n) {
  [1,2,3].forEach(i => {
    document.getElementById("sec"+i).style.display = i===n ? "block" : "none";
    document.getElementById("t"+i).classList.toggle("on", i===n);
  });
}

function addItemRow() {
  const div = document.createElement("div");
  div.style.cssText = "padding:14px;border-radius:18px;box-shadow:var(--in);margin-bottom:14px";
  div.innerHTML = `
    <input class="inbox it-brand" placeholder="Brand & Model (e.g. Apple iPhone 15 Plus)">
    <input class="inbox it-part" placeholder="Part Name (e.g. Display Folder / Battery)">
    <div style="display:grid;grid-template-columns:1fr 110px;gap:10px">
      <select class="inbox it-qual" style="margin:0">
        <option value="Original">Original (OG)</option>
        <option value="Duplicate">Duplicate / Copy</option>
        <option value="Standard">Standard Best Price</option>
      </select>
      <input type="number" class="inbox it-qty" value="1" min="1" placeholder="Qty" style="margin:0">
    </div>
  `;
  document.getElementById("itemsContainer").appendChild(div);
}
addItemRow();

async function submitStep1() {
  const full_name = document.getElementById("fName").value.trim();
  const phone = document.getElementById("fPhone").value.trim();
  const address = document.getElementById("fAddr").value.trim();
  const lang = document.getElementById("fLang").value;
  const email = document.getElementById("fEmail").value.trim();
  if (!full_name || !phone || !address) return alert("Please fill Name, Phone, and Address");

  const res = await fetch("/api/customer/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cid: CID, full_name, phone, address, lang, email })
  });
  const d = await res.json();
  if (d.ok) {
    CID = d.cid;
    localStorage.setItem("adp_cid", CID);
    showTab(2);
  }
}

async function submitOrderForm() {
  if (!CID) return showTab(1);
  const brands = document.querySelectorAll(".it-brand");
  const parts  = document.querySelectorAll(".it-part");
  const quals  = document.querySelectorAll(".it-qual");
  const qtys   = document.querySelectorAll(".it-qty");
  const items = [];
  for (let i = 0; i < brands.length; i++) {
    if (brands[i].value.trim() && parts[i].value.trim()) {
      items.push({
        brand: brands[i].value.trim(),
        model: "",
        part_name: parts[i].value.trim(),
        variant: quals[i].value,
        qty: Number(qtys[i].value) || 1
      });
    }
  }
  if (!items.length) return alert("Please enter at least 1 part");
  const res = await fetch("/api/customer/submit-order", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cid: CID, items })
  });
  const d = await res.json();
  if (d.ok) {
    alert("★ Order Request Submitted! Check your WhatsApp/Telegram chat for live quotation.");
  } else {
    alert(d.error || "Please register first");
    showTab(1);
  }
}

async function trackNow() {
  const id = document.getElementById("trkId").value.trim();
  if (!id) return;
  const r = await fetch("/api/panel/track?order_id=" + id);
  const d = await r.json();
  if (!d.ok) {
    document.getElementById("trkOut").innerHTML = `<div style="color:#e0524a;font-weight:700">× Order #${id} not found.</div>`;
    return;
  }
  const o = d.order;
  document.getElementById("trkOut").innerHTML = `
    <div style="padding:16px;border-radius:18px;box-shadow:var(--in)">
      <div style="font-weight:800;font-size:16px;margin-bottom:6px">Order #${o.id} — ${o.status}</div>
      <div style="font-size:13px;color:var(--mute)">Total: ₹${o.final_total || "Calculating..."} | 20% Adv: ₹${o.advance_20 || 0}</div>
      ${o.tracking_id ? `<div style="margin-top:10px;font-weight:800;color:var(--green)">→ Tracking ID: ${o.tracking_id}</div>` : ""}
    </div>
  `;
}
</script>
</body>
</html>
